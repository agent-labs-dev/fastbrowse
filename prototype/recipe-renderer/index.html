<!doctype html>
<!-- PROTOTYPE: three variants of a recipe/run viewer, switchable with ?variant=a|b|c. -->
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fastbrowse recipe viewer prototype</title>
  <style>
    :root{--ink:#17212b;--muted:#6d7782;--line:#dfe5e9;--paper:#f7f9fa;--card:#fff;--accent:#2b7fff;--green:#16845b;--amber:#aa6b00;--red:#b83a45;--shadow:0 14px 34px #182b3d12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}.shell{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 36px;gap:24px}.brand{font-weight:800;letter-spacing:-.03em;font-size:20px}.brand span{color:var(--accent)}.top small{color:var(--muted)}.top .actions{margin-left:auto;display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--ink);cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.content{max-width:1320px;margin:auto;padding:34px 36px 110px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:750;font-size:11px}.title{font-size:32px;line-height:1.1;letter-spacing:-.045em;margin:7px 0 8px}.sub{color:var(--muted);max-width:760px}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card.pad{padding:22px}.statrow{display:flex;gap:22px;flex-wrap:wrap;margin:24px 0}.stat strong{display:block;font-size:25px;letter-spacing:-.04em}.stat label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.step{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}.step:first-child{border-top:0}.num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#e9f1ff;color:var(--accent);font-weight:800}.op{font-weight:750}.meta{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:600px}.pill{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:#edf7f2;color:var(--green)}.pill.agent{background:#fff5df;color:var(--amber)}.pill.fail{background:#fff0f0;color:var(--red)}.side h3,.card h2{font-size:14px;margin:0 0 14px;letter-spacing:-.01em}.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv b{font-weight:650}.kv span{color:var(--muted);text-align:right;max-width:65%;overflow:hidden;text-overflow:ellipsis}.timeline{position:relative;padding:10px 0 10px 22px}.timeline:before{content:"";position:absolute;left:7px;top:17px;bottom:17px;width:2px;background:#dce7f5}.event{position:relative;padding:13px 0 13px 19px}.event:before{content:"";position:absolute;left:-20px;top:20px;width:11px;height:11px;background:#fff;border:3px solid var(--accent);border-radius:50%}.event h4{margin:0;font-size:14px}.event p{margin:3px 0 0;color:var(--muted);font-size:12px}.event time{float:right;color:var(--muted);font-variant-numeric:tabular-nums}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.drop{border:1px dashed #a9b8c6;border-radius:12px;padding:16px;color:var(--muted);background:#fbfcfd}.video{background:#10161e;min-height:290px;border-radius:13px;display:grid;place-items:center;color:#fff}.video .play{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff70;background:#ffffff18;font-size:24px;color:#fff}.rail{display:grid;grid-template-columns:280px 1fr;min-height:610px}.railnav{padding:22px;border-right:1px solid var(--line);background:#fbfcfd}.railnav .navitem{padding:12px;border-radius:10px;margin-top:6px;cursor:pointer}.railnav .navitem.active{background:#e9f1ff;color:var(--accent);font-weight:750}.railmain{padding:28px}.runbadge{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:750}.empty{color:var(--muted);font-size:13px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 11px;background:#17212b;color:#fff;border-radius:999px;box-shadow:0 14px 34px #17212b44;z-index:5}.switcher button{border:0;background:#ffffff18;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer}.switcher button:hover,.switcher button:focus-visible{background:#ffffff35}.switcher .label{min-width:170px;text-align:center;font-size:12px}.switcher kbd{font:11px ui-monospace;color:#b8c8d8}@media(max-width:800px){.top{padding:0 18px}.content{padding:24px 18px 110px}.grid.two,.rail{grid-template-columns:1fr}.railnav{border-right:0;border-bottom:1px solid var(--line)}.hero{display:block}.hero .actions{margin-top:15px}.step{grid-template-columns:29px 1fr}.step .pill{grid-column:2;justify-self:start}.meta{max-width:calc(100vw - 100px)}}
  </style>
</head>
<body><div id="app"></div><div class="switcher"><button id="prev" aria-label="Previous layout">←</button><div class="label" id="variantLabel"></div><button id="next" aria-label="Next layout">→</button></div>
<script>
const recipe={version:1,task:'Replay a completed shopping flow and heal changed controls',start:'https://thepihut.com',steps:[['click','Product page','recipe'],['click','Add to cart','recipe'],['click','Search','recipe'],['fill','Search query','recipe'],['enter','Search','recipe'],['click','Cart','recipe'],['click','Checkout','recipe'],['fill','Email','recipe'],['fill','First name','recipe'],['fill','Address','recipe'],['fill','City','recipe'],['fill','Postcode','recipe'],['fill','Phone','recipe']]};
const run={status:'complete',steps:recipe.steps.map((s,i)=>({index:i,operation:s[0],target:s[1],decided_by:i===7?'jev':'recipe',outcome:'executed',duration_ms:600+i*41,url:'https://thepihut.com/'})),final_url:'https://thepihut.com/checkouts/demo',recordings:['run6.mp4']};
const variants={a:'A · Operator list',b:'B · Run timeline',c:'C · Studio split'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function steps(){return run.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><div class="op">${esc(s.operation)} <span style="font-weight:500">${esc(s.target)}</span></div><div class="meta">${esc(s.url)} · ${s.duration_ms} ms</div></div><span class="pill ${s.decided_by==='recipe'?'':'agent'}">${esc(s.decided_by)}</span></div>`).join('')}
function header(kicker,title,desc){return `<div class="hero"><div><div class="eyebrow">${kicker}</div><h1 class="title">${title}</h1><div class="sub">${desc}</div></div><div class="actions"><button class="btn">Export JSON</button><button class="btn primary">Replay recipe</button></div></div>`}
function variantA(){return `<main class="content">${header('Recipe · v1','Pi Hut checkout flow','A durable sequence of meaningful browser actions. Controls are matched by role, label, context and link, so a changed page can be healed by the agent.') }<div class="statrow"><div class="stat"><strong>${recipe.steps.length}</strong><label>recorded steps</label></div><div class="stat"><strong>${run.steps.filter(s=>s.decided_by==='recipe').length}</strong><label>replayed</label></div><div class="stat"><strong>${run.steps.filter(s=>s.decided_by!=='recipe').length}</strong><label>agent decisions</label></div><div class="stat"><strong>100%</strong><label>completion</label></div></div><div class="grid two"><section class="card pad"><h2>Recipe steps</h2>${steps()}</section><aside class="card pad side"><h3>Recipe contract</h3><div class="kv"><b>Start</b><span>${esc(recipe.start)}</span></div><div class="kv"><b>Matching</b><span>Semantic control identity</span></div><div class="kv"><b>Healing</b><span>Agent fallback on drift</span></div><div class="kv"><b>Secrets</b><span>Names only, values withheld</span></div><div class="drop">Drop a recipe JSON file here, or use Export JSON to share a reviewable plan.</div></aside></div></main>`}
function variantB(){return `<main class="content">${header('Run · complete','A run you can explain','The timeline makes recovery visible. Each event has a stable step number, decision source, duration and current URL.') }<div class="grid two"><section class="card pad"><div class="runbadge">● Complete <span style="color:var(--muted);font-weight:500">· 1m 21s</span></div><div class="timeline">${run.steps.map((s,i)=>`<div class="event"><time>${(s.duration_ms/1000).toFixed(1)}s</time><h4>${i+1}. ${esc(s.operation)} ${esc(s.target)}</h4><p><span class="pill ${s.decided_by==='recipe'?'':'agent'}">${esc(s.decided_by)}</span> · executed · ${esc(s.url)}</p></div>`).join('')}</div></section><aside class="card pad"><h2>Outcome</h2><div class="video"><button class="play" aria-label="Play recording">▶</button></div><p class="empty">Recording: run6.mp4. The prototype displays the player surface and timeline metadata; it does not synthesize timestamps absent from the JSON.</p><h3>Answer</h3><p>Flow completed with one live Jev decision when the recorded control changed.</p></aside></div></main>`}
function variantC(){return `<main class="content"><div class="rail card"><nav class="railnav"><div class="eyebrow">FASTBROWSE</div><h2 style="margin:10px 0 20px">Run studio</h2><div class="navitem active">Overview</div><div class="navitem">Recipe steps <span style="float:right">${recipe.steps.length}</span></div><div class="navitem">Evidence</div><div class="navitem">Recording</div><div class="navitem">JSON</div><div class="drop" style="margin-top:28px">Import a recipe or run result to inspect it locally.</div></nav><section class="railmain">${header('Run studio · complete','Replay with confidence','A focused review surface for operators who need to inspect a replay, jump to a step and understand healing.') }<div class="grid two"><div><div class="video"><button class="play" aria-label="Play recording">▶</button></div><div style="display:flex;justify-content:space-between;margin:13px 0;color:var(--muted);font-size:12px"><span>00:00</span><span>01:21</span></div></div><div class="card pad"><h2>Selected step</h2><div class="eyebrow">Step 8 · fill</div><h3 style="font-size:20px;margin:7px 0">Email</h3><div class="kv"><b>Decision</b><span class="pill agent">jev</span></div><div class="kv"><b>Outcome</b><span>executed</span></div><div class="kv"><b>Why live</b><span>Recorded control drifted</span></div><button class="btn primary" style="width:100%;margin-top:14px">Inspect JSON</button></div></div><section class="card pad" style="margin-top:18px"><h2>Step map</h2>${steps()}</section></section></div></main>`}
function render(){const key=new URLSearchParams(location.search).get('variant')||'a';document.getElementById('app').innerHTML=key==='b'?variantB():key==='c'?variantC():variantA();document.getElementById('variantLabel').innerHTML=`${variants[key]} <kbd>← →</kbd>`;document.getElementById('prev').onclick=()=>go(key==='a'?'c':key==='b'?'a':'b');document.getElementById('next').onclick=()=>go(key==='a'?'b':key==='b'?'c':'a')}
function go(key){history.replaceState({},'',`?variant=${key}`);render();window.scrollTo({top:0,behavior:'smooth'})}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click()});render();
</script></body></html>
