<!doctype html>
<!-- PROTOTYPE: three variants of a recipe/run viewer, switchable with ?variant=a|b|c. -->
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fastbrowse recipe viewer prototype</title>
  <style>
    :root{--ink:#17212b;--muted:#6d7782;--line:#dfe5e9;--paper:#f7f9fa;--card:#fff;--accent:#2b7fff;--green:#16845b;--amber:#aa6b00;--red:#b83a45;--shadow:0 14px 34px #182b3d12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}.shell{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 36px;gap:24px}.brand{font-weight:800;letter-spacing:-.03em;font-size:20px}.brand span{color:var(--accent)}.top small{color:var(--muted)}.top .actions{margin-left:auto;display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--ink);cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.content{max-width:1320px;margin:auto;padding:34px 36px 110px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:750;font-size:11px}.title{font-size:32px;line-height:1.1;letter-spacing:-.045em;margin:7px 0 8px}.sub{color:var(--muted);max-width:760px}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card.pad{padding:22px}.statrow{display:flex;gap:22px;flex-wrap:wrap;margin:24px 0}.stat strong{display:block;font-size:25px;letter-spacing:-.04em}.stat label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.step{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}.step:first-child{border-top:0}.num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#e9f1ff;color:var(--accent);font-weight:800}.op{font-weight:750}.meta{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:600px}.pill{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:#edf7f2;color:var(--green)}.pill.agent{background:#fff5df;color:var(--amber)}.pill.fail{background:#fff0f0;color:var(--red)}.side h3,.card h2{font-size:14px;margin:0 0 14px;letter-spacing:-.01em}.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv b{font-weight:650}.kv span{color:var(--muted);text-align:right;max-width:65%;overflow:hidden;text-overflow:ellipsis}.timeline{position:relative;padding:10px 0 10px 22px}.timeline:before{content:"";position:absolute;left:7px;top:17px;bottom:17px;width:2px;background:#dce7f5}.event{position:relative;padding:13px 0 13px 19px}.event:before{content:"";position:absolute;left:-20px;top:20px;width:11px;height:11px;background:#fff;border:3px solid var(--accent);border-radius:50%}.event h4{margin:0;font-size:14px}.event p{margin:3px 0 0;color:var(--muted);font-size:12px}.event time{float:right;color:var(--muted);font-variant-numeric:tabular-nums}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.drop{border:1px dashed #a9b8c6;border-radius:12px;padding:16px;color:var(--muted);background:#fbfcfd}.video{background:#10161e;min-height:290px;border-radius:13px;display:grid;place-items:center;color:#fff}.video .play{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff70;background:#ffffff18;font-size:24px;color:#fff}.rail{display:grid;grid-template-columns:280px 1fr;min-height:610px}.railnav{padding:22px;border-right:1px solid var(--line);background:#fbfcfd}.railnav .navitem{padding:12px;border-radius:10px;margin-top:6px;cursor:pointer}.railnav .navitem.active{background:#e9f1ff;color:var(--accent);font-weight:750}.railmain{padding:28px}.runbadge{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:750}.empty{color:var(--muted);font-size:13px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 11px;background:#17212b;color:#fff;border-radius:999px;box-shadow:0 14px 34px #17212b44;z-index:5}.switcher button{border:0;background:#ffffff18;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer}.switcher button:hover,.switcher button:focus-visible{background:#ffffff35}.switcher .label{min-width:170px;text-align:center;font-size:12px}.switcher kbd{font:11px ui-monospace;color:#b8c8d8}@media(max-width:800px){.top{padding:0 18px}.content{padding:24px 18px 110px}.grid.two,.rail{grid-template-columns:1fr}.railnav{border-right:0;border-bottom:1px solid var(--line)}.hero{display:block}.hero .actions{margin-top:15px}.step{grid-template-columns:29px 1fr}.step .pill{grid-column:2;justify-self:start}.meta{max-width:calc(100vw - 100px)}}
  .step{border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;cursor:pointer;color:inherit}.step[aria-current="true"]{background:#f0f6ff}.realvideo{display:block;width:100%;min-height:290px;border-radius:13px;background:#10161e}.json{background:#10161e;color:#d9e7f5;border-radius:10px;padding:14px;overflow:auto;font-size:11px;max-height:240px}
  </style>
</head>
<body><input id="jsonPicker" type="file" accept="application/json,.json" multiple hidden><input id="videoPicker" type="file" accept="video/*" hidden><div id="app"></div><div class="switcher"><button id="prev" aria-label="Previous layout">←</button><div class="label" id="variantLabel"></div><button id="next" aria-label="Next layout">→</button></div>
<script>
const sampleRecipe={version:1,task:'Sample recipe flow',start:'https://example.test',steps:[['click','Product page','recipe'],['click','Add to cart','recipe'],['click','Search','recipe'],['fill','Search query','recipe'],['enter','Search','recipe'],['click','Cart','recipe'],['click','Checkout','recipe'],['fill','Email','recipe'],['fill','First name','recipe'],['fill','Address','recipe'],['fill','City','recipe'],['fill','Postcode','recipe'],['fill','Phone','recipe']]};
const sampleRun={status:'completed',steps:sampleRecipe.steps.map((s,i)=>({index:i,operation:s[0],target:s[1],decided_by:i===7?'jev':'recipe',outcome:'executed',duration_ms:600+i*41,url:'https://example.test/'})),final_url:'https://example.test/checkout',recordings:[]};
let recipe=structuredClone(sampleRecipe),run=structuredClone(sampleRun),selected=0,videoUrl='',videoTime=0,isSample=true;
const variants={a:'A · Operator list',b:'B · Run timeline',c:'C · Studio split'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function steps(){return run.steps.map((s,i)=>`<button class="step" data-step="${i}" aria-current="${i===selected}"><div class="num">${i+1}</div><div><div class="op">${esc(s.operation)} <span style="font-weight:500">${esc(s.target)}</span></div><div class="meta">${esc(s.url||'No URL')} · ${s.duration_ms??'No duration'} ms</div></div><span class="pill ${s.decided_by==='recipe'?'':'agent'}">${esc(s.decided_by||'unknown')}</span></button>`).join('')}
function actions(){return `<div class="actions"><button class="btn" data-action="import-json">Import JSON</button><button class="btn" data-action="import-video">Import video</button><button class="btn" data-action="export">Export JSON</button></div>`}
function header(kicker,title,desc){return `<div class="hero"><div><div class="eyebrow">${kicker}</div><h1 class="title">${title}</h1><div class="sub">${desc}</div><p class="empty">${isSample?'Sample data, local only':'Imported locally: '+esc(recipe.task||'recipe')}</p></div>${actions()}</div>`}
function wire(){document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.step);render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>({ 'import-json':()=>jsonPicker.click(),'import-video':()=>videoPicker.click(),'export':exportJson,'inspect':()=>alert(JSON.stringify(run.steps[selected]||{},null,2))}[b.dataset.action]||(()=>{}))());}
function video(){return videoUrl?`<video class="realvideo" controls preload="metadata" src="${videoUrl}"></video>`:`<div class="video"><button class="btn" data-action="import-video">Choose a recording</button></div>`}
function variantA(){return `<main class="content">${header('Recipe · local viewer','Recipe review','Inspect a durable sequence of browser actions. Import a recipe or run JSON from your machine.') }<div class="statrow"><div class="stat"><strong>${recipe.steps.length}</strong><label>recipe steps</label></div><div class="stat"><strong>${run.steps.filter(s=>s.decided_by==='recipe').length}</strong><label>recipe decisions</label></div><div class="stat"><strong>${run.steps.filter(s=>s.decided_by&&s.decided_by!=='recipe').length}</strong><label>fallback decisions</label></div></div><div class="grid two"><section class="card pad"><h2>Steps</h2>${steps()}</section><aside class="card pad side"><h3>Recipe contract</h3><div class="kv"><b>Start</b><span>${esc(recipe.start||'Not provided')}</span></div><div class="kv"><b>Status</b><span>${esc(run.status||'No run imported')}</span></div><div class="drop">Use Import JSON to load one or two JSON files. The viewer never uploads them.</div></aside></div></main>`}
function variantB(){return `<main class="content">${header('Run · imported','Run timeline','The timeline reports metadata present in the run JSON. It does not infer video sync from durations.') }<div class="grid two"><section class="card pad"><div class="runbadge">● ${esc(run.status||'No status')}</div><div class="timeline">${run.steps.map((s,i)=>`<button class="event" data-step="${i}"><time>${s.duration_ms==null?'--':(s.duration_ms/1000).toFixed(1)+'s'}</time><h4>${i+1}. ${esc(s.operation)} ${esc(s.target)}</h4><p><span class="pill ${s.decided_by==='recipe'?'':'agent'}">${esc(s.decided_by||'unknown')}</span> · ${esc(s.outcome||'unknown')} · ${esc(s.url||'No URL')}</p></button>`).join('')}</div></section><aside class="card pad"><h2>Recording</h2>${video()}<p class="empty">${videoUrl?'Imported locally.':'No video imported.'} No absolute timestamps were provided, so step synchronization is unavailable.</p><h3>Selected step</h3>${detail()}</aside></div></main>`}
function detail(){const s=run.steps[selected]||{};return `<div class="kv"><b>Step</b><span>${selected+1}</span></div><div class="kv"><b>Operation</b><span>${esc(s.operation||'Not provided')}</span></div><div class="kv"><b>Decision</b><span>${esc(s.decided_by||'Not provided')}</span></div><button class="btn" data-action="inspect">Inspect JSON</button>`}
function variantC(){return `<main class="content"><div class="rail card"><nav class="railnav"><div class="eyebrow">FASTBROWSE</div><h2 style="margin:10px 0 20px">Run studio</h2><a class="navitem active" href="#overview">Overview</a><a class="navitem" href="#steps">Recipe steps <span style="float:right">${recipe.steps.length}</span></a><a class="navitem" href="#recording">Recording</a><div class="drop" style="margin-top:28px">Local files stay in this browser tab.</div></nav><section class="railmain" id="overview">${header('Run studio · inspectable','Studio split','Select a step to inspect its exact JSON. Add a recording when you have one.') }<div class="grid two" id="recording"><div>${video()}</div><div class="card pad"><h2>Selected step</h2>${detail()}<pre class="json">${esc(JSON.stringify(run.steps[selected]||{},null,2))}</pre></div></div><section class="card pad" id="steps" style="margin-top:18px"><h2>Step map</h2>${steps()}</section></section></div></main>`}
function exportJson(){const blob=new Blob([JSON.stringify({recipe,run},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fastbrowse-review.json';a.click();URL.revokeObjectURL(a.href)}
async function importJson(files){for(const file of files){try{const raw=JSON.parse(await file.text()),data=raw.result||raw;if(Array.isArray(data.steps)&&data.task&&data.steps.every(s=>Array.isArray(s))){recipe=data;isSample=false}else if(Array.isArray(data.steps)&&data.steps.every(s=>s&&typeof s==='object'&&!Array.isArray(s))){run=data;isSample=false}else if(raw.recipe||raw.run){if(raw.recipe)recipe=raw.recipe;if(raw.run)run=raw.run;isSample=false}else throw new Error('Expected a recipe with tuple steps or a run with object steps')}catch(e){alert(`Could not import ${file.name}: ${e.message}`)}}selected=0;render()}
function render(){const key=new URLSearchParams(location.search).get('variant')||'a',y=scrollY,app=document.getElementById('app'),view=k=>k==='b'?variantB():k==='c'?variantC():variantA();app.innerHTML=view(key);const currentHeight=app.scrollHeight;let tallest=currentHeight;for(const k of ['a','b','c']){if(k!==key){app.innerHTML=view(k);tallest=Math.max(tallest,app.scrollHeight)}}app.innerHTML=view(key);app.style.minHeight=`${tallest}px`;document.getElementById('variantLabel').innerHTML=`${variants[key]} <kbd>← →</kbd>`;document.getElementById('prev').onclick=()=>go(key==='a'?'c':key==='b'?'a':'b');document.getElementById('next').onclick=()=>go(key==='a'?'b':key==='b'?'c':'a');wire();const v=document.querySelector('video');if(v){v.addEventListener('timeupdate',()=>{videoTime=v.currentTime});if(videoTime)v.addEventListener('loadedmetadata',()=>{v.currentTime=videoTime},{once:true})}scrollTo(0,y)}
function go(key){history.replaceState({},'',`?variant=${key}`);render()}
jsonPicker.onchange=()=>importJson(jsonPicker.files);videoPicker.onchange=()=>{const f=videoPicker.files[0];if(f){if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);render()}};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()});render();
</script></body></html>
