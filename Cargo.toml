[workspace]
resolver = "3"
members = [
    "crates/fastbrowse",
    "crates/fastbrowse-core",
    "crates/fastbrowse-clients",
    "crates/fastbrowse-browser",
    "crates/fastbrowse-agent",
    "crates/fastbrowse-cli",
    "crates/fastbrowse-run",
    "crates/fastbrowse-py",
    "crates/fastbrowse-node",
    "crates/fastbrowse-probe",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/agent-labs-dev/fastbrowse"
homepage = "https://github.com/agent-labs-dev/fastbrowse"

# The crates are published together at one version, each pinned to the others' exact one, as the npm packages are.
# `scripts/npm_versions.py --write` moves these with the workspace version.
[workspace.dependencies]
fastbrowse-core = { path = "crates/fastbrowse-core", version = "=0.9.0" }
fastbrowse-clients = { path = "crates/fastbrowse-clients", version = "=0.9.0" }
fastbrowse-browser = { path = "crates/fastbrowse-browser", version = "=0.9.0" }
fastbrowse-agent = { path = "crates/fastbrowse-agent", version = "=0.9.0" }
fastbrowse-run = { path = "crates/fastbrowse-run", version = "=0.9.0" }
fastbrowse-cli = { path = "crates/fastbrowse-cli", version = "=0.9.0" }

[profile.release]
lto = true
codegen-units = 1
# Stripping at link time left a dylib whose LINKEDIT string pool dyld refused on macOS 27.
strip = "none"

# The size-tuned profile: `cargo build --profile release-small`. Plain `--release` keeps the workspace defaults
# so the two can be compared.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
