<!DOCTYPE html>
<html>
<head><title>Cross-origin frame</title></head>
<body>
  <h1>Inside the frame</h1>
  <button id="frame-button">Frame button</button>
  <input id="frame-input" placeholder="Frame field">
  <div style="height:3000px"></div>
  <p>Below the frame fold</p>
  <script>
    document.getElementById('frame-button').addEventListener('click', () => {
      document.getElementById('frame-button').textContent = 'Clicked';
    });
  </script>
</body>
</html>
