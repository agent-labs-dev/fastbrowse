[package]
name = "fastbrowse-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "fastbrowse's agent: the run loop, policy, planning, retrieval and verification."

[dependencies]
fastbrowse-core = { workspace = true }
# Cuts a pictured control's card out of the viewport screenshot; PNG is the only format Jev is sent.
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# Insertion order: a prompt or a Jev state must list its keys in the order Python wrote them.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
# `jev_spend`: the scope a run's Jev calls bill their receipts into, which lives with the clients.
fastbrowse-clients = { workspace = true }
# Owned startup calls run beside browser startup, page reads beside paging, and a time limit bounds the run. A long
# read leaves its worker to the runtime's other tasks, which needs the multi-threaded runtime's `block_in_place`.
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
# A pictograph such as an emoji is part of a value, not punctuation around it.
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
url = "2.5.9"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "time", "macros", "sync", "test-util"] }
