# An extension module installed beside fastbrowse, not inside its wheel, until the core ships in it.
#   uvx maturin build --release -m crates/fastbrowse-py/Cargo.toml -i .venv/bin/python
#   uv pip install --reinstall target/wheels/fastbrowse_native-*.whl
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fastbrowse-native"
requires-python = ">=3.13"
dynamic = ["version"]

[tool.maturin]
module-name = "fastbrowse_native"
