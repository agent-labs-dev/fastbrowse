[package]
name = "fastbrowse-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `fastbrowse._native`, built into the `fastbrowse` wheel by maturin from the root pyproject.toml.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
fastbrowse-agent = { path = "../fastbrowse-agent" }
fastbrowse-browser = { path = "../fastbrowse-browser" }
# The CLI the `fastbrowse` command runs, with the hidden `--run-task` stand-ins the binary has (the Python CLI ships
# its own), so the smoke test drives the wheel as it drives the binary.
fastbrowse-cli = { path = "../fastbrowse-cli" }
fastbrowse-clients = { path = "../fastbrowse-clients" }
fastbrowse-core = { path = "../fastbrowse-core" }
fastbrowse-run = { path = "../fastbrowse-run" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# abi3: one wheel per platform serves every CPython from 3.13 on.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py313"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
