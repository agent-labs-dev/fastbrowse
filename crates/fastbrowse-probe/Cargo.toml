[package]
name = "fastbrowse-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Bench binary on the browser crate: scripted observe, capture and act steps with their timings, and the binary whose size the browser layer is measured by."

[dependencies]
fastbrowse-browser = { workspace = true }
fastbrowse-core = { workspace = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time"] }
