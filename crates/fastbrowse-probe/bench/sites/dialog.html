<!DOCTYPE html>
<html>
<head><title>Dialog fixture</title></head>
<body>
  <h1>Dialogs</h1>
  <button id="alert" onclick="alert('Saved'); this.textContent = 'Alerted'">Save</button>
  <button id="confirm" onclick="this.textContent = confirm('Delete?') ? 'Deleted' : 'Kept'">Delete</button>
  <input id="name" placeholder="Name">
</body>
</html>
