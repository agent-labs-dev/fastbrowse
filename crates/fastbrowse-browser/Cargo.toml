[package]
name = "fastbrowse-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "fastbrowse's browser layer: Chrome over raw CDP, sessions, observation, capture and actions."

[features]
default = ["cloud"]
# Browser Use Cloud: an HTTPS client on the TLS stack the websocket already links, so it adds no crates.
cloud = []
# The Cua Driver cursor overlay (Linux X11). A child process over stdio, no extra crates.
cursor = []
# Recording the active tab to MP4 through ffmpeg. A child process, no extra crates.
recording = []

[dependencies]
# Hashes, HMAC and the TLS provider, already linked by rustls.
ring = "0.17.14"
# Base64 and base32, already linked by tungstenite.
data-encoding = "2.11.1"
fastbrowse-core = { workspace = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
httparse = "1.10.1"
# The text of a PDF, which Chrome's viewer keeps out of the DOM.
pdf-extract = "0.12.1"
calamine = "0.38.0"
quick-xml = "0.42.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
# Objects keep insertion order, as Python dicts do: a reply parsed and written back keeps its keys where they were.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "sync", "process", "io-util", "io-std", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1.0.11"

[target.'cfg(unix)'.dependencies]
# kill(2), already linked by tokio.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros"] }
