[package]
name = "fastbrowse-run"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Port of src/fastbrowse/run.py: one task end to end, from the browser and the model clients to the result."

[dependencies]
fastbrowse-agent = { path = "../fastbrowse-agent" }
# `record` films the tab through ffmpeg and `cursor` draws through the Cua Driver: child processes, no extra crates.
fastbrowse-browser = { path = "../fastbrowse-browser", features = ["recording", "cursor"] }
fastbrowse-clients = { path = "../fastbrowse-clients" }
fastbrowse-core = { path = "../fastbrowse-core" }
# The HTML5 character reference tables `html.unescape` decodes a fetched document with.
htmlize = { version = "1.1.0", features = ["unescape"] }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "fs"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "net", "io-util"] }
url = "2.5"
