[package]
name = "fastbrowse-run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "fastbrowse's run_task: one task end to end, from the browser and the model clients to the result."

[dependencies]
fastbrowse-agent = { workspace = true }
# `record` films the tab through ffmpeg and `cursor` draws through the Cua Driver: child processes, no extra crates.
fastbrowse-browser = { workspace = true, features = ["recording", "cursor"] }
fastbrowse-clients = { workspace = true }
fastbrowse-core = { workspace = true }
# gzip and deflate bodies, which httpx decodes for the Python reader; miniz_oxide is pure Rust.
flate2 = "1.1.10"
# The HTML5 character reference tables `html.unescape` decodes a fetched document with.
htmlize = { version = "1.1.0", features = ["unescape"] }
indexmap = "2.14.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "time", "macros", "sync", "fs"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "time", "macros", "sync", "net", "io-util"] }
url = "2.5.8"
