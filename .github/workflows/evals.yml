name: Evals

# The fixture suites drive a real Chrome, Jev and the LLM. They are the only check on whether the agent still
# browses well, and the only gate that catches a regression in a task, a grader or the mock site, so they run on
# a schedule and on demand, and the job fails when a task regresses.
#
# `pull_request` is deliberately absent: a pull request must never be handed the model key. `workflow_dispatch`
# needs write access to trigger, so it is a maintainer checking their own branch. The suites do not gate a release:
# approval is the decision, and a tag publishes on its build and smoke tests alone.
on:
  workflow_dispatch:
    inputs:
      repeat:
        # At least 3: fewer is a diagnostic, not the run a published comparison rests on, so the job refuses it
        # before spending. Every task must pass every run, for the same reason.
        description: Runs per task (at least 3)
        default: "3"
      budget:
        description: Approved total model dollars, with no per-task step, time or call ceilings
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *"

permissions: {}

jobs:
  fixtures:
    # Without the key there is nothing to run, and a fork or a mirror should not fail a schedule it cannot serve.
    if: github.repository == 'agent-labs-dev/fastbrowse'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read}
    # A full mock repeat is minutes, not hours, but a stuck cloud browser must not hold a runner for a day.
    timeout-minutes: 90
    env:
      EVAL_REPEAT: ${{ inputs.repeat || '3' }}
      EVAL_BUDGET: ${{ inputs.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - run: uv sync --locked --all-extras
      - name: Require the full comparison protocol
        # A quick dispatch cannot be the green run a published comparison points at: fewer than three repeats is
        # not a rate. This fails before the credential check and before any paid call the runner would make.
        run: |
          case "$EVAL_REPEAT" in
            ''|*[!0-9]*) echo "repeat must be an integer, got '$EVAL_REPEAT'"; exit 1 ;;
          esac
          test "$EVAL_REPEAT" -ge 3 || { echo "repeat must be at least 3, got $EVAL_REPEAT"; exit 1; }
      - name: Check the model credentials
        # A missing provider fails before the first task, with its setting named and no empty score report.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: uv run python scripts/eval_stability.py --check-providers
      - name: Run the fixture eval suites
        id: fixtures
        # The runner exits non-zero on any failed attempt. The stability check below is the verdict: every task
        # of both suites must pass every run at the full repeat count, so a runner that died part way cannot pass
        # on the rows it left.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          budget_args=()
          if test -n "$EVAL_BUDGET"; then budget_args=(--budget "$EVAL_BUDGET"); fi
          uv run python -m fastbrowse.evals.runner "${budget_args[@]}" \
            --suite local mock \
            --repeat "$EVAL_REPEAT" \
            --out artifacts/evals/nightly.jsonl
      - name: Check the stability budget
        # A credential check that failed leaves no rows, and a stability error would then read as a task failure;
        # this step stays out of a run that never started.
        if: always() && steps.fixtures.outcome != 'skipped'
        run: |
          uv run python scripts/eval_stability.py artifacts/evals/nightly.jsonl \
            --suite local mock \
            --repeat "$EVAL_REPEAT"
      - name: Check the publication gate
        # Deterministic integrity (build, task and suite versions, dataset pins, cost honesty) and the
        # task-version matched regression against the published baselines. The fixture runner keeps no
        # retries, so its ledger is not required here; a published comparison goes through the same gate
        # with --require-ledger, enforced by `versions --publish`.
        if: always() && steps.fixtures.outcome != 'skipped'
        run: |
          uv run python -m fastbrowse.evals.publication \
            --rows artifacts/evals/nightly.jsonl \
            --baseline docs/results
      - name: Check the eval tracking credentials
        id: langfuse
        # The upload is how a run stays reviewable after this job's artifact expires. The two secrets are the whole
        # configuration: the host and the project are constants, so a key issued for another project is refused
        # rather than written to. A missing pair is named here and the upload is skipped, because a run that
        # measured fine should not fail the schedule over a bookkeeping credential nobody has added yet.
        if: always() && steps.fixtures.outcome != 'skipped'
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          missing=()
          test -n "$LANGFUSE_PUBLIC_KEY" || missing+=(LANGFUSE_PUBLIC_KEY)
          test -n "$LANGFUSE_SECRET_KEY" || missing+=(LANGFUSE_SECRET_KEY)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Eval tracking is off::the ${missing[*]} repository secret is not set, so this run is not published to Langfuse"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the fixture run to Langfuse
        # One trace per attempt, named for the build and released under the campaign it came from, so a number
        # here traces back to the commit that produced it. The step reads every trace back before it passes;
        # `publication` above still decides what, if anything, may be published as a figure.
        if: always() && steps.fixtures.outcome != 'skipped' && steps.langfuse.outputs.ready == 'true'
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: uv run python -m fastbrowse.evals.tracking --rows artifacts/evals/nightly.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-rows
          path: artifacts/evals/nightly*
          if-no-files-found: warn
