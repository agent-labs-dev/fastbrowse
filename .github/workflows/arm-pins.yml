name: Arm pins

# Every comparison arm runs its competitor's latest release, and a campaign group refuses to start on a stale pin
# (benchmark-campaign.yml). This proposes the bump the day a competitor releases, as one pull request kept on
# `bot/arm-pins`, so a comparison is never held waiting for someone to notice the release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: arm-pins
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'agent-labs-dev/fastbrowse'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {contents: write, pull-requests: write, actions: write}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - name: Move every pin to its latest release
        working-directory: evals
        run: |
          uv sync --locked
          uv run --no-sync python -m fastbrowse_evals.arm_pins update
          uv run --no-sync fastbrowse-evals browser catalog ../src/fastbrowse/evals/benchmark-catalog.json
      - name: Open or update the bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only)
          if test "${#changed[@]}" -eq 0; then echo "Every pin is at its latest release."; exit 0; fi
          branch=bot/arm-pins
          # The branch restarts from main each time, so the pull request always carries exactly today's bump.
          gh api "repos/$REPO/git/refs/heads/$branch" -X PATCH -f sha="$BASE" -F force=true >/dev/null \
            || gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$BASE" >/dev/null
          # main requires signed commits; a commit made through the API is signed by GitHub.
          additions=$(for path in "${changed[@]}"; do
            jq -n --arg path "$path" --arg contents "$(base64 -w0 "$path")" '{path: $path, contents: $contents}'
          done | jq -s .)
          summary=$(cd evals && uv run --no-sync python -c "import json; print(', '.join(f'{k} {v[\"version\"][:12]}' for k, v in json.load(open('src/fastbrowse_evals/adapters/arm-pins.json')).items()))")
          jq -n --arg repo "$REPO" --arg branch "$branch" --arg head "$BASE" --argjson additions "$additions" \
            --arg headline "chore(evals): move the comparison arms to their latest releases" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $head,
                message: {headline: $headline}, fileChanges: {additions: $additions}}}}' \
            | gh api graphql --input - >/dev/null
          if test -z "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')"; then
            gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "chore(evals): move the comparison arms to their latest releases" \
              --body "A competitor released a new version. Campaign groups refuse a stale pin, so this moves every arm to its latest release. Pins now: $summary."
          fi
          # A push made with the workflow token starts no workflow, so the checks the pull request needs start here.
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
