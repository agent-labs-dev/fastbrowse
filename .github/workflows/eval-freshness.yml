# Eval cases carry the build they were written against (`src/fastbrowse/evals/freshness.json`). A release moves the
# package version and the judge moves with its own tag, so the tags drift on their own: nothing in the release asks a
# case to be re-stamped, and left alone a case keeps scoring while its number was earned on a build that has been
# replaced. CI reports that drift and fails on it, which is right for the PR that carries a version bump but leaves
# the tags stale on `main` until someone reads the failure and runs `--resync` by hand.
#
# This job closes that loop: it runs on a schedule, and again whenever the things a tag is derived from change, and
# opens a PR carrying the re-labelled book. It runs no eval: the tags move and the figures are not re-measured, so
# merging that PR accepts the old figures under the new build. Nothing here decides a score.
#
# A PR opened with the run's own token starts no CI, so CI could never report on it. `CLAUDE_PR_TOKEN` is a token
# that may push here, and without it the job still commits to a branch and says the PR was left to a human.
name: Eval freshness
on:
  schedule:
    # Ahead of the working week, so a stale book is proposed rather than found mid-review.
    - cron: "23 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    # Everything a tag is derived from: the case lists and versions, the judge the harness grades with, and the
    # package version `current()` reads.
    paths:
      - src/fastbrowse/evals/versions.json
      - src/fastbrowse/evals/judge.py
      - src/fastbrowse/evals/tasks.py
      - src/fastbrowse/evals/mock_tasks.py
      - pyproject.toml
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: eval-freshness
  cancel-in-progress: false
jobs:
  resync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The push below names its own token; a persisted checkout token would be sent in its place.
        with: {ref: main, fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Re-label every movable case at this build, measuring nothing
        run: uv run python -m fastbrowse.evals.freshness --resync
      - name: Open the PR that carries the re-labelled book
        env:
          TOKEN: ${{ secrets.CLAUDE_PR_TOKEN || github.token }}
          # A token that can push here. Without one the branch is still pushed, and the warning says why no PR
          # was opened: a PR from the run's own token would arrive with no checks to report.
          HAS_PUSH_TOKEN: ${{ secrets.CLAUDE_PR_TOKEN != '' }}
        run: |
          set -euo pipefail
          book=src/fastbrowse/evals/freshness.json
          if git diff --quiet -- "$book"; then
            echo "every case is already tagged at this build"
            exit 0
          fi
          version="$(uv run python -c 'from importlib.metadata import version; print(version("fastbrowse"))')"
          branch="bot/eval-freshness-$version"
          git -c user.name="agent-labs-pr-bot" -c user.email="pr-bot@agent-labs.dev" \
            commit -qam "chore(evals): tag cases at fastbrowse $version"
          git push --force "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          if [ "$HAS_PUSH_TOKEN" != "true" ]; then
            echo "::warning title=Eval tags left behind::CLAUDE_PR_TOKEN is not set, so the re-labelled book is on $branch and no PR was opened for it."
            exit 0
          fi
          if GH_TOKEN="$TOKEN" gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "the PR for $branch is already open, and the push above updated it"
            exit 0
          fi
          # The body says what moved and why, not just that a file changed: every changed entry is one case
          # whose tag drifted from the build in this checkout, and nothing here changes a case or an expectation.
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Eval cases are tagged with the build they were written against, and a release moves that tag on. This PR re-labels those tags at \`fastbrowse $version\` and does not re-measure anything: no eval ran. \`$book\` now records this build for every case that can move, and a case that cannot keeps its tag and its recorded reason." \
            "Reading it: every changed entry is one case whose tag drifted from the build in this checkout. Nothing in the diff changes a case, a fixture or an expectation; it changes the build each number is attributed to, so merging this accepts numbers measured on an older build under this one. CI re-runs the freshness check and the eval tests on this PR." \
            "This PR is opened and updated by the \`Eval freshness\` workflow; a rerun replaces the same branch.")"
          GH_TOKEN="$TOKEN" gh pr create --base main --head "$branch" \
            --title "chore(evals): tag cases at fastbrowse $version" \
            --body "$body"
