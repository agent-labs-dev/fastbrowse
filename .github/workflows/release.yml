name: Release
# One tag publishes one version to PyPI and to npm. Nothing is published until the sdist, the five wheels and the
# five binaries have all passed, and then in an order that never leaves a package pointing at one that is not there yet:
# PyPI, the five platform packages, the SDK.
#
# A tag runs the fixture suites itself, before anything is published: the release carries its own proof that the
# agent still browses well on the exact commit that ships, rather than needing somebody to dispatch a run first.
#
# Run by hand, it stops after the binaries and publishes nothing. That is how a change to the build is tried
# without spending a version number, which no registry gives back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: false
      # A tag that disagrees with the package version would publish one number under another's name.
      - if: github.event_name == 'push'
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      # No registry takes a version back, so only a commit already on main (reviewed, CI-gated) is published;
      # a tag pushed on a branch or a stray local commit stops here.
      - if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      # The tag is the Python version, and every npm version is published from it.
      - run: uv run python scripts/npm_versions.py
      # The sdist here; the wheels are one per platform, built and smoke-tested by the binaries workflow.
      - run: uv build --sdist
      # The release notes ARE the changelog entry, so the GitHub release, the repository and the site all
      # say the same thing about a version. A tag whose version has no entry fails here rather than
      # publishing notes nobody wrote.
      - run: uv run python scripts/changelog.py "$(uv version --short)" > "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  # The same fixture suites the schedule runs, on the tag. They take longer than a build, so they start
  # alongside it, and the guard below holds the release until both are green. Read-only contents, and the
  # model keys come from this repository's secrets: a maintainer pushes a tag, never a pull request.
  evals:
    if: github.event_name == 'push'
    permissions: {contents: read}
    secrets: inherit
    uses: ./.github/workflows/evals.yml

  # Everything a release needs besides a build: the fixture suites green on the commit that ships, and for a
  # release that publishes a comparison, its measured build in the release history running the same executable
  # code. It is told the eval job above went green rather than looking up an earlier run, so a green schedule on
  # some other commit cannot stand in for the tag. Read-only queries; no repository secret is added.
  guard:
    needs: [build, evals]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: false
      # This job only runs once the eval job has succeeded, so its green result is what the guard is told.
      - name: Check the release evals guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/release_guard.py "$(uv version --short)" --evals-ran-here

  # All five targets, each built and smoke-tested on a runner of its own kind, alongside the eval run rather
  # than after it. Nothing publishes unless the guard passes too, so a red fixture gate costs a build but never
  # a version number.
  binaries:
    needs: build
    permissions: {contents: read}
    uses: ./.github/workflows/binaries.yml

  # The first job that publishes. It needs every build job and the guard, and each later publish job needs the
  # one before it, so a target that fails to build, to pass its smoke test or to pass the fixture suites
  # publishes nothing anywhere.
  github-release:
    needs: [guard, binaries]
    # A run started by hand is a rehearsal and ends here, and with this job every job after it is skipped.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this job's OIDC identity, so no token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # The six npm packages, by trusted publishing as PyPI is: npm accepts this job's OIDC identity for each
  # package, so no token is stored and none is passed here. npm checks the identity against the name of
  # this file and of the environment, which is why the publishing is here and not in a workflow this one calls.
  npm:
    needs: pypi
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      # The tag is this number, which the first job checked.
      - run: echo "VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      # Trusted publishing needs npm 11.5.1, which Node 22 does not carry and Node 24 does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # An older npm fails the publish with a missing-token error that does not name its cause.
      - run: test "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)" = 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fastbrowse-*
          path: ${{ runner.temp }}/builds
      # All six are made ready before the first is published, so a package that cannot be assembled or built
      # leaves npm untouched.
      - name: Assemble the platform packages
        env:
          # What the platform packages carry: `rust`, the Rust binary and the Node addon (docs/adr/0004), or
          # `pyinstaller`, the frozen Python package. The binaries workflow builds and smoke-tests both until 0.9.0,
          # so going back is this one word.
          NPM_BUILD: rust
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if [ "$NPM_BUILD" = rust ]; then
              build="$RUNNER_TEMP/builds/fastbrowse-rust-$target"
              set -- "$build/fastbrowse-rust-$target.tar.gz" --rust --addon "$build/fastbrowse.node"
            else
              set -- "$RUNNER_TEMP/builds/fastbrowse-$target/fastbrowse-$target.tar.gz"
            fi
            uv run --no-project python scripts/npm_platform_package.py "$@" \
              --target "$target" --version "$VERSION" --out "$RUNNER_TEMP/npm/$target"
          done
      - run: npm ci --ignore-scripts
      - run: npm --prefix packages/sdk run build
      # npm packs a licence file found beside the manifest.
      - run: cp LICENSE packages/sdk/
      # A version already on npm is passed over, so a run that stopped partway can be run again: npm refuses
      # to publish a version twice, and the job would otherwise stop at the first package that went through.
      - name: Publish the platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if npm view "@fastbrowse/$target@$VERSION" version > /dev/null 2>&1; then
              echo "@fastbrowse/$target $VERSION is already published"
            else
              npm publish "$RUNNER_TEMP/npm/$target"
            fi
          done
      # Last: it depends on the five above at this exact version.
      - name: Publish the SDK
        run: |
          if npm view "fastbrowse@$VERSION" version > /dev/null 2>&1; then
            echo "fastbrowse $VERSION is already published"
          else
            # With `./`, or npm reads the argument as a GitHub repository.
            npm publish ./packages/sdk --access public
          fi

  # The Arch package for this release, built from the sources PyPI now holds and run in a clean Arch container,
  # then pushed to the AUR so Arch users get the release without anyone copying two files by hand. Its
  # PKGBUILD and .SRCINFO are this run's `aur` artifact too, and it opens the PR that keeps `packaging/aur` on
  # `main` at the same version, which is what the weekly AUR check compares against.
  aur:
    needs: [build, pypi]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # A release regenerates `packaging/aur` from the PyPI release in its own checkout, and `main` keeps the previous
  # version until someone copies it back. That difference is exactly what the weekly AUR check fails on, so this
  # opens the PR that closes it. A token is needed because a PR opened with the run's own token starts no checks,
  # and the required `check` could never report on it; with none set the release says so and leaves it to a human.
  aur-sync:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Move the package to the release
        env: {VERSION: "${{ needs.build.outputs.version }}"}
        run: python3 scripts/aur_package.py "$VERSION" --write --wait 300
      - name: Open the PR that keeps packaging/aur current
        env:
          TOKEN: ${{ secrets.AUR_SYNC_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packaging/aur; then
            echo "main already pins this release"
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning title=packaging/aur left behind::AUR_SYNC_TOKEN is not set, so main keeps the previous package and the weekly AUR check will read it as a release behind."
            exit 0
          fi
          branch="chore/aur-$VERSION"
          # A rerun after a failure later in this job finds the branch it already pushed, so it is reused rather
          # than pushed over. Rerunning the failed jobs is the documented way to recover a half-finished release.
          git remote set-url origin "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet origin "$branch" || true
          if git rev-parse --verify --quiet "origin/$branch" > /dev/null; then
            git checkout --quiet -B "$branch" "origin/$branch"
            git checkout --quiet "$GITHUB_SHA" -- packaging/aur
          else
            git checkout --quiet -b "$branch"
          fi
          git add packaging/aur
          if git diff --cached --quiet; then
            echo "the branch already carries this package"
          else
            git -c user.name="fastbrowse release" -c user.email="cillian@nebula.gg" \
              commit -m "chore(aur): package fastbrowse $VERSION from the PyPI release"
            git push origin "$branch"
          fi
          if ! GH_TOKEN="$TOKEN" gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            GH_TOKEN="$TOKEN" gh pr create --base main --head "$branch" \
              --title "chore(aur): package fastbrowse $VERSION from the PyPI release" \
              --body "The v$VERSION release regenerated \`packaging/aur\` from the PyPI release it had just published. These are the same bytes on \`main\`, so the weekly AUR check does not read the committed package as a release behind."
          else
            echo "the PR for $branch is already open"
          fi

  # The site shows this release only once it builds again after the version is on PyPI, when its
  # "runs exactly the release below it" is true; site.yml asks it to.
  site:
    permissions: {contents: read}
    needs: pypi
    uses: ./.github/workflows/site.yml
    secrets:
      SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
