name: Release
# One tag publishes one version to PyPI, npm, crates.io, Maven Central, NuGet and the Go module proxy. Nothing is published until the sdist, the five wheels and
# the five binaries have all passed, and then in an order that never leaves a package pointing at one that is not there
# yet: PyPI, then the five platform packages and the SDK, and the crates each after those it depends on.
#
# Approval is the decision. A tag publishes once the sdist, the wheels and the binaries are green; it no longer
# waits on a separate eval run, because a mechanical gate that re-decides an already-approved release held
# approved numbers and packages back over one missing secret. The fixture suites still run nightly, on demand,
# and their results are published on the site.
#
# Run by hand, it stops after the binaries and publishes nothing. That is how a change to the build is tried
# without spending a version number, which no registry gives back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: false
      # A tag that disagrees with the package version would publish one number under another's name.
      - if: github.event_name == 'push'
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      # The tag is the Python version, and every npm version is published from it.
      - run: uv run python scripts/npm_versions.py
      # The sdist here; the wheels are one per platform, built and smoke-tested by the binaries workflow.
      - run: uv build --sdist
      # The release notes ARE the changelog entry, so the GitHub release, the repository and the site all
      # say the same thing about a version. A tag whose version has no entry fails here rather than
      # publishing notes nobody wrote.
      - run: uv run python scripts/changelog.py "$(uv version --short)" > "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  # All five targets, each built and smoke-tested on a runner of its own kind.
  binaries:
    needs: build
    permissions: {contents: read}
    uses: ./.github/workflows/binaries.yml

  # The first job that publishes. It needs every build job, and each later publish job needs the one before it,
  # so a target that fails to build or to pass its smoke test publishes nothing anywhere.
  github-release:
    needs: binaries
    # A run started by hand is a rehearsal and ends here, and with this job every job after it is skipped.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes/
      # The binaries as archives, one per platform, which the Go module downloads and checks against the checksums
      # its own tag pins.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fastbrowse-rust-*
          path: rust/
      - run: gh release create "$GITHUB_REF_NAME" dist/* rust/*/fastbrowse-rust-*.tar.gz --notes-file notes/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this job's OIDC identity, so no token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # The six npm packages, by trusted publishing as PyPI is: npm accepts this job's OIDC identity for each
  # package, so no token is stored and none is passed here. npm checks the identity against the name of
  # this file and of the environment, which is why the publishing is here and not in a workflow this one calls.
  npm:
    needs: pypi
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      # The tag is this number, which the first job checked.
      - run: echo "VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      # Trusted publishing needs npm 11.5.1, which Node 22 does not carry and Node 24 does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # An older npm fails the publish with a missing-token error that does not name its cause.
      - run: test "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)" = 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fastbrowse-*
          path: ${{ runner.temp }}/builds
      # All six are made ready before the first is published, so a package that cannot be assembled or built
      # leaves npm untouched.
      # Each carries the Rust binary and the Node addon (docs/adr/0004).
      - name: Assemble the platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            build="$RUNNER_TEMP/builds/fastbrowse-rust-$target"
            uv run --no-project python scripts/npm_platform_package.py "$build/fastbrowse-rust-$target.tar.gz" \
              --addon "$build/fastbrowse.node" --target "$target" --version "$VERSION" --out "$RUNNER_TEMP/npm/$target"
          done
      - run: npm ci --ignore-scripts
      - run: npm --prefix packages/sdk run build
      # npm packs a licence file found beside the manifest.
      - run: cp LICENSE packages/sdk/
      # A version already on npm is passed over, so a run that stopped partway can be run again: npm refuses
      # to publish a version twice, and the job would otherwise stop at the first package that went through.
      - name: Publish the platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if npm view "@fastbrowse/$target@$VERSION" version > /dev/null 2>&1; then
              echo "@fastbrowse/$target $VERSION is already published"
            else
              npm publish "$RUNNER_TEMP/npm/$target"
            fi
          done
      # Last: it depends on the five above at this exact version.
      - name: Publish the SDK
        run: |
          if npm view "fastbrowse@$VERSION" version > /dev/null 2>&1; then
            echo "fastbrowse $VERSION is already published"
          else
            # With `./`, or npm reads the argument as a GitHub repository.
            npm publish ./packages/sdk --access public
          fi

  # The Rust crates, by trusted publishing as npm is: crates.io accepts this job's OIDC identity for each crate and
  # hands back a token that is revoked when the job ends. A crate depends on the others at this exact version, so
  # each is published after those it depends on, and the facade `fastbrowse` last.
  crates:
    needs: pypi
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - run: echo "VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # A version already on crates.io is passed over, so a run that stopped partway can be run again: crates.io
      # refuses a version twice. rustup installs the toolchain rust-toolchain.toml pins on the first cargo call.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in fastbrowse-core fastbrowse-clients fastbrowse-browser fastbrowse-agent fastbrowse-run \
            fastbrowse-cli fastbrowse; do
            if curl -sfo /dev/null -A "fastbrowse release (github.com/agent-labs-dev/fastbrowse)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already published"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  # The Java client on Maven Central: `dev.agentlabs:fastbrowse`, and one `natives-<target>` jar per platform holding
  # that platform's binary from this release's archives. Central takes no OIDC identity, so the account's token and
  # the signing key are the `maven-central` environment's secrets. Central refuses a version twice, so a run that
  # stopped after publishing passes over it.
  maven:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: maven-central
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fastbrowse-rust-*
          path: ${{ runner.temp }}/rust
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Each jar's binary sits where the client looks for it on the classpath.
      - name: Stage the binaries
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            into="java/target/natives/$target/dev/agentlabs/fastbrowse/natives/$target"
            mkdir -p "$into"
            tar -xzf "$RUNNER_TEMP/rust/fastbrowse-rust-$target/fastbrowse-rust-$target.tar.gz" -C "$into" --strip-components 1
          done
      - name: Publish
        env:
          VERSION: "${{ needs.build.outputs.version }}"
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if curl -sfo /dev/null "https://repo1.maven.org/maven2/dev/agentlabs/fastbrowse/$VERSION/fastbrowse-$VERSION.pom"; then
            echo "dev.agentlabs:fastbrowse $VERSION is already published"
            exit 0
          fi
          # The client's tests need a binary to start; the binaries workflow ran each one already.
          mvn -B -f java/pom.xml -P release -DskipTests deploy

  # The .NET client on NuGet: `Fastbrowse`, carrying each platform's binary from this release's archives under
  # runtimes/<rid>/native. Trusted publishing: NuGet trades this job's OIDC identity for a short-lived key, for the
  # account the `nuget` environment's NUGET_USER variable names. A version already there is passed over.
  nuget:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fastbrowse-rust-*
          path: ${{ runner.temp }}/rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: "10.0.x"}
      # The release's targets by the runtime identifiers .NET names them with.
      - name: Stage the binaries
        run: |
          for pair in darwin-arm64:osx-arm64 darwin-x64:osx-x64 linux-arm64:linux-arm64 linux-x64:linux-x64 win32-x64:win-x64; do
            target="${pair%%:*}"
            rid="${pair#*:}"
            mkdir -p "dotnet/runtimes/$rid/native"
            tar -xzf "$RUNNER_TEMP/rust/fastbrowse-rust-$target/fastbrowse-rust-$target.tar.gz" \
              -C "dotnet/runtimes/$rid/native" --strip-components 1
          done
      - run: dotnet pack dotnet/src/Fastbrowse -c Release -o "$RUNNER_TEMP/nupkg"
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$RUNNER_TEMP"/nupkg/Fastbrowse.*.nupkg --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  # The Go module for this release: the tag `go/vX.Y.Z`, on a commit off `main` that pins the release's binary archives
  # by their SHA-256. The module downloads its platform's archive from the GitHub release above and refuses one that
  # is not the archive pinned here, so the commit is made from the same artifacts the release holds.
  go:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The token stays in the checkout because this job pushes the tag, and only the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fastbrowse-rust-*
          path: ${{ runner.temp }}/rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go/go.mod, cache: false}
      - env: {VERSION: "${{ needs.build.outputs.version }}"}
        run: python3 scripts/go_binaries.py "$VERSION" "$RUNNER_TEMP"/rust/*/fastbrowse-rust-*.tar.gz
      - run: test -z "$(gofmt -l go)" && go -C go vet ./...
      # A tag already there means a run that stopped partway got this far; the module a tag names never changes.
      - name: Tag the module
        env: {VERSION: "${{ needs.build.outputs.version }}"}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/go/v$VERSION" > /dev/null; then
            echo "go/v$VERSION is already tagged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "go: pin the v$VERSION binaries" go/binaries.go
          git tag "go/v$VERSION"
          git push origin "go/v$VERSION"

  # The Arch package for this release, built from the sources PyPI now holds and run in a clean Arch container,
  # then pushed to the AUR so Arch users get the release without anyone copying two files by hand. Its
  # PKGBUILD and .SRCINFO are this run's `aur` artifact too, and it opens the PR that keeps `packaging/aur` on
  # `main` at the same version, which is what the weekly AUR check compares against.
  aur:
    needs: [build, pypi]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # A release regenerates `packaging/aur` from the PyPI release in its own checkout, and `main` keeps the previous
  # version until someone copies it back. That difference is exactly what the weekly AUR check fails on, so this
  # opens the PR that closes it. A token is needed because a PR opened with the run's own token starts no checks,
  # and the required `check` could never report on it; with none set the release says so and leaves it to a human.
  aur-sync:
    needs: [build, pypi]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Move the package to the release
        env: {VERSION: "${{ needs.build.outputs.version }}"}
        run: python3 scripts/aur_package.py "$VERSION" --write --wait 300
      - name: Open the PR that keeps packaging/aur current
        env:
          TOKEN: ${{ secrets.AUR_SYNC_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packaging/aur; then
            echo "main already pins this release"
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning title=packaging/aur left behind::AUR_SYNC_TOKEN is not set, so main keeps the previous package and the weekly AUR check will read it as a release behind."
            exit 0
          fi
          branch="chore/aur-$VERSION"
          # A rerun after a failure later in this job finds the branch it already pushed, so it is reused rather
          # than pushed over. Rerunning the failed jobs is the documented way to recover a half-finished release.
          git remote set-url origin "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet origin "$branch" || true
          if git rev-parse --verify --quiet "origin/$branch" > /dev/null; then
            git checkout --quiet -B "$branch" "origin/$branch"
            git checkout --quiet "$GITHUB_SHA" -- packaging/aur
          else
            git checkout --quiet -b "$branch"
          fi
          git add packaging/aur
          if git diff --cached --quiet; then
            echo "the branch already carries this package"
          else
            git -c user.name="fastbrowse release" -c user.email="cillian@nebula.gg" \
              commit -m "chore(aur): package fastbrowse $VERSION from the PyPI release"
            git push origin "$branch"
          fi
          if ! GH_TOKEN="$TOKEN" gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            GH_TOKEN="$TOKEN" gh pr create --base main --head "$branch" \
              --title "chore(aur): package fastbrowse $VERSION from the PyPI release" \
              --body "The v$VERSION release regenerated \`packaging/aur\` from the PyPI release it had just published. These are the same bytes on \`main\`, so the weekly AUR check does not read the committed package as a release behind."
          else
            echo "the PR for $branch is already open"
          fi

  # The site shows this release only once it builds again after the version is on PyPI, when its
  # "runs exactly the release below it" is true; site.yml asks it to.
  site:
    permissions: {contents: read}
    needs: pypi
    uses: ./.github/workflows/site.yml
    secrets:
      SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
