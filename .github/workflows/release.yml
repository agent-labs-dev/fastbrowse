name: Release
# One tag publishes one version to PyPI and to npm. Nothing is published until the wheel, the five binaries
# and the two signed macOS builds have all passed, and then in an order that never leaves a package pointing
# at one that is not there yet: PyPI, the five platform packages, the SDK.
#
# Run by hand, it stops after signing and publishes nothing. That is how the certificate and the notary
# credentials are tried without spending a version number, which no registry gives back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      # A tag that disagrees with the package version would publish one number under another's name.
      - if: github.event_name == 'push'
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      # No registry takes a version back, so only a commit already on main (reviewed, CI-gated) is published;
      # a tag pushed on a branch or a stray local commit stops here.
      - if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The tag is the Python version, and every npm version is published from it.
      - run: uv run python scripts/npm_versions.py
      - run: uv build
      # Install the wheel alone, outside the checkout, before anything is published: a module or data file
      # (snapshot.js is read at import) missing from the wheel fails here instead of on users' machines.
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import fastbrowse.browser.page, fastbrowse.cli"
      # The release notes ARE the changelog entry, so the GitHub release, the repository and the site all
      # say the same thing about a version. A tag whose version has no entry fails here rather than
      # publishing notes nobody wrote.
      - run: uv run python scripts/changelog.py "$(uv version --short)" > "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  # All five targets, each built and smoke-tested on a runner of its own kind. After the guards, so a tag that
  # could not be released costs no build.
  binaries:
    needs: build
    permissions: {contents: read}
    uses: ./.github/workflows/binaries.yml

  # macOS runs a program only if it is signed, and Gatekeeper stops one that Apple has not notarized. The build
  # is signed here and not while it is frozen, so that pull requests build with no certificate. Everything
  # the binaries workflow checked of the build is checked again afterwards, because signing rewrites every
  # Mach-O file and turns on the hardened runtime.
  sign:
    name: sign ${{ matrix.target }}
    needs: binaries
    runs-on: ${{ matrix.runner }}
    environment: apple-signing
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        # The runners the two targets were built on, so the signed build is run where the unsigned one was.
        include:
          - {target: darwin-arm64, runner: macos-14}
          - {target: darwin-x64, runner: macos-15-intel}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastbrowse-${{ matrix.target }}
          path: ${{ runner.temp }}/unsigned
      - name: Unpack the build
        run: |
          mkdir "$RUNNER_TEMP/build"
          tar -xzf "$RUNNER_TEMP/unsigned/fastbrowse-$TARGET.tar.gz" -C "$RUNNER_TEMP/build"
          echo "BUILD=$RUNNER_TEMP/build/fastbrowse" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
      # The certificate goes into a keychain made for this job and deleted at its end. `CSC_LINK` is the
      # base64 of the .p12 that holds the Developer ID Application certificate and its key.
      - name: Import the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          password="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -f pkcs12 -P "$CSC_KEY_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Without this, codesign stops to ask for the keychain's password, and no one is there to type it.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # By its hash: a name can match more than one certificate.
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: uv run --no-project python scripts/macos_sign.py sign "$BUILD" --identity "$IDENTITY" --keychain "$KEYCHAIN"
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: uv run --no-project python scripts/macos_sign.py notarize "$BUILD"
      # Every Mach-O file: a Developer ID signature that holds, the hardened runtime, Apple's timestamp, and a
      # notarization ticket Apple answers for when asked.
      - run: uv run --no-project python scripts/macos_sign.py verify "$BUILD" --notarized
      - run: uv run --no-project python scripts/smoke_binary.py "$BUILD/fastbrowse"
      # Then as the npm package it is published in, whose files are copies of the ones signed above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "22", package-manager-cache: false}
      - run: npm ci --ignore-scripts
      - name: Assemble the npm platform package
        run: |
          uv run --no-project python scripts/npm_platform_package.py "$BUILD" \
            --target "$TARGET" --version "$(uv version --short)" --out "$RUNNER_TEMP/npm-package"
      - run: uv run --no-project python scripts/macos_sign.py verify "$RUNNER_TEMP/npm-package/fastbrowse" --notarized
      - run: uv run --no-project python scripts/smoke_npm_install.py "$RUNNER_TEMP/npm-package"
      - if: always()
        run: security delete-keychain "$KEYCHAIN" || true
      # The same archive the binaries workflow uploads, under a name that says it is the signed one.
      - run: tar -czf "fastbrowse-$TARGET.tar.gz" -C "$RUNNER_TEMP/build" fastbrowse
        # Otherwise macOS tar adds a `._<file>` entry for each file with extended attributes.
        env: {COPYFILE_DISABLE: "1"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastbrowse-${{ matrix.target }}-signed
          path: fastbrowse-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          # Already compressed.
          compression-level: 0

  # The first job that publishes. It needs every build job, and each later publish job needs the one before
  # it, so a target that fails to build, to pass its smoke test or to be notarized publishes nothing anywhere.
  github-release:
    needs: [build, binaries, sign]
    # A run started by hand is a rehearsal and ends here, and with this job every job after it is skipped.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this job's OIDC identity, so no token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # The six npm packages, by trusted publishing as PyPI is: npm accepts this job's OIDC identity for each
  # package, so no token is stored and none is passed here. npm checks the identity against the name of
  # this file and of the environment, which is why the publishing is here and not in a workflow this one calls.
  npm:
    needs: pypi
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false
      # The tag is this number, which the first job checked.
      - run: echo "VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      # Trusted publishing needs npm 11.5.1, which Node 22 does not carry and Node 24 does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # An older npm fails the publish with a missing-token error that does not name its cause.
      - run: test "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)" = 11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fastbrowse-*
          path: ${{ runner.temp }}/builds
      # All six are made ready before the first is published, so a package that cannot be assembled or built
      # leaves npm untouched. The macOS packages come from the signed builds and from no other.
      - name: Assemble the platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            case "$target" in
              darwin-*) artifact="fastbrowse-$target-signed" ;;
              *) artifact="fastbrowse-$target" ;;
            esac
            uv run --no-project python scripts/npm_platform_package.py \
              "$RUNNER_TEMP/builds/$artifact/fastbrowse-$target.tar.gz" \
              --target "$target" --version "$VERSION" --out "$RUNNER_TEMP/npm/$target"
          done
      - run: npm ci --ignore-scripts
      - run: npm --prefix packages/sdk run build
      # npm packs a licence file found beside the manifest.
      - run: cp LICENSE packages/sdk/
      # A version already on npm is passed over, so a run that stopped partway can be run again: npm refuses
      # to publish a version twice, and the job would otherwise stop at the first package that went through.
      - name: Publish the platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if npm view "@fastbrowse/$target@$VERSION" version > /dev/null 2>&1; then
              echo "@fastbrowse/$target $VERSION is already published"
            else
              npm publish "$RUNNER_TEMP/npm/$target"
            fi
          done
      # Last: it depends on the five above at this exact version.
      - name: Publish the SDK
        run: |
          if npm view "fastbrowse@$VERSION" version > /dev/null 2>&1; then
            echo "fastbrowse $VERSION is already published"
          else
            # With `./`, or npm reads the argument as a GitHub repository.
            npm publish ./packages/sdk --access public
          fi

  # The site shows this release only once it builds again after the version is on PyPI, when its
  # "runs exactly the release below it" is true; site.yml asks it to.
  site:
    permissions: {contents: read}
    needs: pypi
    uses: ./.github/workflows/site.yml
    secrets:
      SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
