name: Approve benchmark publication
on:
  # Approval is the results shown in the channel and the reviewer saying ship. Dispatching this publishes that
  # decision: it checks the figures are true and records which bytes it published, and never asks again.
  workflow_dispatch:
    inputs:
      allow_first_publication:
        description: Establish the first baseline when none is published
        required: true
        type: boolean
        default: false
      protocol_change:
        description: Publish groups whose catalog, tasks or limits changed as a fresh baseline
        required: true
        type: boolean
        default: false
      protocol_note:
        description: Why the protocol changed (recorded beside the figures)
        required: false
        type: string
        default: ''
permissions: {}
jobs:
  approve:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read, actions: read}
    steps:
      # The receipt names the candidate committed on main, which CI reads back from that commit.
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {python-version: '3.13'}
      - run: uv sync --locked
      - name: Validate full coverage and the exact fixture build
        env:
          GH_TOKEN: '${{ github.token }}'
          BOOTSTRAP: '${{ inputs.allow_first_publication }}'
          PROTOCOL_CHANGE: '${{ inputs.protocol_change }}'
          PROTOCOL_NOTE: '${{ inputs.protocol_note }}'
        run: |
          args=()
          if [ "$BOOTSTRAP" = true ]; then args+=(--bootstrap); fi
          if [ "$PROTOCOL_CHANGE" = true ]; then
            args+=(--protocol-change --protocol-note "$PROTOCOL_NOTE" --protocol-record protocol-change.json)
          fi
          uv run python -m fastbrowse.evals.benchmarks --candidate docs/results/benchmark-candidate.json \
            --baseline docs/results/benchmarks.json --verify-fixture "${args[@]}"
      - name: Record the published bytes
        run: |
          uv run python - <<'PY'
          import hashlib, os
          from datetime import UTC, datetime
          from pathlib import Path
          from fastbrowse.evals.benchmarks import Approval, ProtocolChange
          record = Path('protocol-change.json')
          receipt = Approval(
              candidate_sha256=hashlib.sha256(Path('docs/results/benchmark-candidate.json').read_bytes()).hexdigest(),
              workflow_run=int(os.environ['GITHUB_RUN_ID']),
              head_sha=os.environ['GITHUB_SHA'],
              approved_by=os.environ['GITHUB_ACTOR'],
              approved_at=datetime.now(UTC).isoformat(timespec='seconds').replace('+00:00', 'Z'),
              protocol_change=ProtocolChange.model_validate_json(record.read_bytes()) if record.exists() else None,
          )
          Path('benchmark-approval.json').write_text(receipt.model_dump_json(indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-approval
          path: benchmark-approval.json
          if-no-files-found: error
