name: Binaries
# The Rust binary, the Node addon and the PyPI wheel, built and smoke-tested once per target. CI calls this when a
# change could alter what is built, and the release calls it before anything is published, so both test the build a
# user would get.
on:
  workflow_call:
    inputs:
      # The two macOS runners cost the most and queue the longest, so CI leaves them to the release.
      macos:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      macos:
        type: boolean
        default: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  # The targets to build, each on a runner of its own kind. Everything but Intel macOS runs on Blacksmith, whose
  # GitHub-hosted counterparts queued for most of a run; Blacksmith has no Intel Mac, and `macos-15-intel` is the last
  # Intel image GitHub offers besides `macos-26-intel`. A Linux build runs on the glibc it links and newer ones, and
  # Blacksmith's Ubuntu is 24.04 (glibc 2.39), so the Linux builds link glibc 2.34's symbols through zig instead
  # (`glibc`, and the wheel's `manylinux` tag): they run on RHEL 9, Amazon Linux 2023, Ubuntu 22.04 and Debian 12 as
  # well. A matrix cannot drop an `include` entry, so the list is picked here and both build jobs read it.
  targets:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env: {MACOS: "${{ inputs.macos }}"}
        run: |
          all='[
            {"target": "darwin-arm64", "triple": "aarch64-apple-darwin", "runner": "blacksmith-6vcpu-macos-26", "addon": "libfastbrowse_node.dylib"},
            {"target": "darwin-x64", "triple": "x86_64-apple-darwin", "runner": "macos-15-intel", "addon": "libfastbrowse_node.dylib"},
            {"target": "linux-x64", "triple": "x86_64-unknown-linux-gnu", "runner": "blacksmith-8vcpu-ubuntu-2404", "addon": "libfastbrowse_node.so", "glibc": "2.34", "manylinux": "manylinux_2_34"},
            {"target": "linux-arm64", "triple": "aarch64-unknown-linux-gnu", "runner": "blacksmith-8vcpu-ubuntu-2404-arm", "addon": "libfastbrowse_node.so", "glibc": "2.34", "manylinux": "manylinux_2_34"},
            {"target": "win32-x64", "triple": "x86_64-pc-windows-msvc", "runner": "blacksmith-8vcpu-windows-2025", "addon": "fastbrowse_node.dll"}
          ]'
          if [ "$MACOS" = false ]; then filter='map(select(.target | startswith("darwin-") | not))'; else filter='.'; fi
          echo "include=$(jq -c "$filter" <<< "$all")" >> "$GITHUB_OUTPUT"

  # The Rust `fastbrowse` (crates/fastbrowse-cli, docs/adr/0001) and the Node addon, per target, which the npm
  # platform packages carry.
  #
  # Each target leaves `fastbrowse-rust-<target>`: `fastbrowse-rust-<target>.tar.gz`, which unpacks to
  # `fastbrowse/` holding the one executable, and the addon as `fastbrowse.node` beside it. It is an archive because
  # an uploaded artifact loses file modes, and the executable bit with them.
  rust:
    name: rust ${{ matrix.target }}
    needs: targets
    permissions: {contents: read}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    env:
      TARGET: ${{ matrix.target }}
      TRIPLE: ${{ matrix.triple }}
      ADDON: ${{ matrix.addon }}
      GLIBC: ${{ matrix.glibc }}
      EXE: ${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # The smoke scripts are standard library only, so the interpreter uv installs is all they need; uv also runs
      # cargo-zigbuild for the Linux builds.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      # rustup reads rust-toolchain.toml and installs the pinned toolchain on first use. The addon is built in
      # `release`: `release-small` aborts on a panic, which in an addon takes the host process with it.
      - name: Build
        run: |
          if [ -n "$GLIBC" ]; then
            build=(uvx --from cargo-zigbuild==0.24.0 --with ziglang==0.17.0 cargo-zigbuild build --target "$TRIPLE.$GLIBC")
          else
            build=(cargo build --target "$TRIPLE")
          fi
          "${build[@]}" --locked --profile release-small -p fastbrowse-cli
          "${build[@]}" --locked --release -p fastbrowse-node
      - name: Stage the build
        run: |
          mkdir -p stage/fastbrowse
          cp "target/$TRIPLE/release-small/fastbrowse$EXE" stage/fastbrowse/
          cp "target/$TRIPLE/release/$ADDON" fastbrowse.node
      # The linker signs an arm64 executable ad hoc already. Signing here gives the Intel build and the addon the
      # same signature, and the check holds for all of them.
      # What the build links is what a user's system must have, whatever the runner's own glibc is.
      - name: Check the glibc floor
        if: matrix.glibc
        run: |
          newest="$(objdump -T stage/fastbrowse/fastbrowse fastbrowse.node | grep -o 'GLIBC_[0-9.]*' | cut -c7- | sort -uV | tail -n 1)"
          echo "newest glibc symbol: $newest, floor: $GLIBC"
          test "$(printf '%s\n' "$newest" "$GLIBC" | sort -V | tail -n 1)" = "$GLIBC"
      - name: Sign ad hoc
        if: startsWith(matrix.target, 'darwin-')
        run: |
          codesign --force --sign - stage/fastbrowse/fastbrowse fastbrowse.node
          codesign --verify --strict stage/fastbrowse/fastbrowse fastbrowse.node
      - name: Install Chromium
        if: matrix.target == 'linux-arm64'
        run: |
          npx --yes playwright@1.63.0 install --with-deps chromium
          chrome="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chromium-*' | head -n 1)"
          test -x "$chrome"
          echo "FASTBROWSE_CHROME=$chrome" >> "$GITHUB_ENV"
      - run: uv run --no-project python scripts/smoke_binary.py "stage/fastbrowse/fastbrowse$EXE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22", package-manager-cache: false}
      - run: npm ci --ignore-scripts
      # The install smoke starts the binary, then the addon, each from the package npm unpacked.
      - name: Assemble the npm platform package
        run: |
          uv run --no-project python scripts/npm_platform_package.py "stage/fastbrowse/fastbrowse$EXE" \
            --addon fastbrowse.node --target "$TARGET" --version "$(uv version --short)" \
            --out "$RUNNER_TEMP/npm-package"
      - run: uv run --no-project python scripts/smoke_npm_install.py "$RUNNER_TEMP/npm-package"
      - name: Record the size
        working-directory: ${{ runner.temp }}/npm-package
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          # The template literal is JavaScript, for node to expand.
          # shellcheck disable=SC2016
          node -e 'const [p] = require(process.argv[1]); const mb = n => (n / 1048576).toFixed(1);
            console.log(`| \`${process.env.TARGET}\` (Rust) | ${mb(p.size)} MB packed | ${mb(p.unpackedSize)} MB |`)' \
            "$RUNNER_TEMP/pack.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: tar -czf "fastbrowse-rust-$TARGET.tar.gz" -C stage fastbrowse
        env: {COPYFILE_DISABLE: "1"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastbrowse-rust-${{ matrix.target }}
          path: |
            fastbrowse-rust-${{ matrix.target }}.tar.gz
            fastbrowse.node
          if-no-files-found: error

  # The PyPI wheel per target: the Python package with the Rust core in it as `fastbrowse._native` (docs/adr/0004),
  # abi3 so one wheel serves every CPython from 3.13 on. Installed alone into an empty environment, its commands then
  # pass the smoke test.
  wheel:
    name: wheel ${{ matrix.target }}
    needs: targets
    permissions: {contents: read}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The binaries' runners, and the Linux wheels link glibc 2.34 through zig as the binaries do. maturin checks
        # the wheel's symbols against the manylinux tag it is given and refuses one that needs more.
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    env:
      TARGET: ${{ matrix.target }}
      MANYLINUX: ${{ matrix.manylinux }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      # rustup reads rust-toolchain.toml and installs the pinned toolchain on first use.
      # zig only for the Linux wheels: it is what links them to the older glibc, and it has no build for Windows.
      - name: Build the wheel
        run: |
          zig=()
          linux=()
          if [ -n "$MANYLINUX" ]; then
            zig=(--with ziglang==0.17.0)
            linux=(--zig --compatibility "$MANYLINUX")
          fi
          uvx "${zig[@]}" maturin==1.16.0 build --release --locked --out wheels "${linux[@]}"
      - name: Install the wheel alone
        run: |
          uv venv --no-project "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" wheels/*.whl
          bin="$RUNNER_TEMP/wheel/bin"
          if [ "$TARGET" = win32-x64 ]; then bin="$RUNNER_TEMP/wheel/Scripts"; fi
          echo "WHEEL_BIN=$bin" >> "$GITHUB_ENV"
      - name: Install Chromium
        if: matrix.target == 'linux-arm64'
        run: |
          npx --yes playwright@1.63.0 install --with-deps chromium
          chrome="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chromium-*' | head -n 1)"
          test -x "$chrome"
          echo "FASTBROWSE_CHROME=$chrome" >> "$GITHUB_ENV"
      # A module missing from the wheel fails here, not on a user's machine.
      - run: uv run --no-project python scripts/smoke_binary.py "$WHEEL_BIN/fastbrowse"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error
