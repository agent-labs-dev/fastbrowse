# Advisory: Jev judges what no lint rule can, whether a change's prose is true to its diff (scripts/jev_review.py).
# It never blocks and is not a required check.
name: Jev review
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  # pull_request_target runs this job as the base branch defines it, from the base branch's code: the pull
  # request's head is fetched only as a ref to diff, so nothing it changed runs where the key is.
  jev-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/jev_review.py --base "${{ github.event.pull_request.base.sha }}" --head pr/head
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
