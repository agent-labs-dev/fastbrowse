# Advisory: Jev judges what no lint rule can, whether a change's prose is true to its diff (scripts/jev_review.py).
# It never blocks and is not a required check.
name: Jev review
on:
  pull_request_target:
permissions: {}
jobs:
  # pull_request_target runs this job as the base branch defines it, from the base branch's code: the pull
  # request's head is fetched only as a ref to diff, so nothing it changed runs where the key is.
  jev-review:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env: {PR_NUMBER: "${{ github.event.pull_request.number }}"}
        run: git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/jev_review.py --base "$BASE_SHA" --head pr/head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
