name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      # The hosted-arm eval imports browser_use_sdk and the MCP server imports mcp; without the extras, pyright
      # sees a different tree than we do.
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Prose is part of the product surface: ASCII punctuation everywhere, and Vale's wording rules on prose.
      - run: uv run python scripts/no_slop.py
      - run: uv run vale sync
      - run: uv run vale README.md docs src scripts tests
      - run: uv run pytest -q
