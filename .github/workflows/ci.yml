name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner --redact
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      # The hosted-arm eval imports browser_use_sdk and the MCP server imports mcp; without the extras, ty
      # sees a different tree than we do.
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      # Prose is part of the product surface: ASCII punctuation everywhere, and Vale's wording rules on prose.
      - run: uv run python scripts/no_slop.py
      - run: uv run vale sync
      - run: uv run vale README.md docs src scripts tests
      - run: uv run pytest -q
