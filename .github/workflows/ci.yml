name: CI
on:
  pull_request:
    # `labeled` so adding `build-binaries` starts a run that builds them; see `changes`.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Manual dispatch lets a head without an automatic pull-request run receive the required checks.
  # A dispatch with `task` set runs only the real-site job: the candidate drives one task in a Browser Use Cloud
  # browser from this runner, so a real-site check never runs on a developer's machine.
  workflow_dispatch:
    inputs:
      task: {description: "Real-site task; empty runs the normal checks", required: false, default: ""}
      start: {description: "URL to open first", required: false, default: ""}
      args: {description: "Extra fastbrowse arguments, space separated", required: false, default: ""}
      max_dollars: {description: "Spend ceiling for the run", required: false, default: "2"}
      max_steps: {description: "Step ceiling for the run", required: false, default: "60"}
permissions: {}
# A push to a pull request makes the run on its previous commit moot. Runs on `main` each finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secrets:
    if: ${{ !inputs.task }}
    permissions: {contents: read}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan for secrets
        # Checkout fetches other branches too; scan this build's complete ancestry, not unrelated branch content.
        run: gitleaks detect --source . --no-banner --redact --log-opts=HEAD
  gate:
    if: ${{ !inputs.task }}
    permissions: {contents: read, actions: read}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # The floor and the latest. An embedder pinned to 3.13 (Nebula is) cannot install a package that
        # only builds on 3.14, and a floor no job runs stops being true within a release.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history so the publication check can read docs/results as they stand on the base branch.
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "${{ matrix.python }}"
      - run: rustup show
      # `uv sync` compiles the Rust core (dev profile) into `target/`; restore the dependency build the other jobs share.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {shared-key: python-core}
      # tests/test_ci.py imports yaml; without the extra, ty sees a different tree than we do.
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      # Prose is part of the product surface: ASCII punctuation everywhere, and Vale's wording rules on prose.
      # A release publishes its changelog entry, so the entry has to exist before the tag does.
      - run: uv run python scripts/changelog.py --check "$(uv version --short)"
      # One tag publishes PyPI and npm, so the SDK's manifest has to carry the version `pyproject.toml` does.
      - run: uv run python scripts/npm_versions.py
      - run: uv run python scripts/no_slop.py
      # The README is the PyPI page and these files build fastbrowse.ai: a flag, setting, status, exit code
      # or link they name has to be one the code has, and the version needs its changelog entry.
      - run: uv run python scripts/docs_sync.py
      - run: uv run vale sync
      - run: uv run vale README.md CHANGELOG.md AGENTS.md CONTRIBUTING.md docs skills src scripts tests
      - name: Check stored eval manifest
        run: uv run python -m fastbrowse.evals.storage --manifest docs/results/evidence.manifest.json --check
      - run: uv run pytest -q
      # A published row cannot be hand-edited past `--publish`: the added or changed docs/results files are
      # gated against the trusted rows at the base branch, and a new results file with no ledger is refused.
      # This is deterministic, so it needs no model key and runs on a pull request.
      - name: Check benchmark candidates and owner approval
        env:
          BASE: "${{ github.base_ref || github.event.repository.default_branch }}"
          GH_TOKEN: "${{ github.token }}"
        run: uv run python -m fastbrowse.evals.benchmarks --check-diff "origin/$BASE"
      - name: Check changed published eval rows
        env: {BASE: "${{ github.base_ref || github.event.repository.default_branch }}"}
        run: uv run python -m fastbrowse.evals.publication --check-diff "origin/$BASE"

  # evals/ is its own project (fastbrowse_evals, the benchmark harness as a Parallax plugin) with its own lock.
  evals:
    if: ${{ !inputs.task }}
    permissions: {contents: read}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults: {run: {working-directory: evals}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - run: rustup show
      # The lock builds this checkout's fastbrowse, Rust core included; share the dependency build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {shared-key: python-core}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q

  # The fastbrowse-hosted arm against the live public API with a test key: real submit, poll and run body, no
  # browser and no charge. Forks get no secrets, so it runs only on this repository's own branches.
  hosted-simulator:
    if: ${{ !inputs.task && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions: {contents: read}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults: {run: {working-directory: evals}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {shared-key: python-core}
      - run: uv sync --locked
      - env: {FASTBROWSE_HOSTED_API_KEY: "${{ secrets.FASTBROWSE_HOSTED_TEST_KEY }}"}
        run: uv run pytest -q -m hosted_simulator tests/test_hosted_api.py

  project-rules:
    if: ${{ !inputs.task }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22"}
      # The rules and actionlint run from the tools alone; the package, and the Rust core it compiles, are not needed.
      - run: uv sync --locked --no-install-project
      - run: npm ci --ignore-scripts
      - run: npm run check:browser
      - run: uv run --no-sync actionlint
      # The Jev review's base-only pull_request_target use needs human review of zizmor's warning.
      - name: Zizmor (advisory)
        continue-on-error: true
        run: uvx zizmor==1.32.0 --offline .github/workflows

  sdk:
    if: ${{ !inputs.task }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22"}
      - run: rustup show
      # `uv sync` compiles the Rust core (dev profile) into `target/`; restore the dependency build the other jobs share.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {shared-key: python-core}
      # The SDK's tests start `fastbrowse serve --stdio` from this environment, so they meet the real server.
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      # The SDK's types are written from protocol/schema.json and committed. A schema changed without them fails here.
      - run: npm run generate:sdk
      - run: git diff --exit-code -- packages/sdk/src/protocol.ts
      - run: npm run check:sdk
      # The package says it runs on Node 20, and its tests need a newer Node to run TypeScript. The files built
      # above are started here on that floor: one `initialize` against the server, then close.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "20", package-manager-cache: false}
      - run: node packages/sdk/test/node_floor.mjs .venv/bin/fastbrowse

  # The Rust core (docs/adr/0001): its own checks, then the Node addon against cases taken from its suites. The
  # Python suites, which reach the core through the package, run in `gate`.
  rust:
    if: ${{ !inputs.task }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions: {contents: read}
    env:
      # A CI build starts from a restored cache or from nothing, never from a previous step's incremental
      # state, and incremental state only slows a full build (measured: `cargo test --workspace --no-run`
      # 42 s with it, 35 s without).
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Installs the toolchain rust-toolchain.toml pins, so the cache below is keyed on the compiler that
      # will actually build rather than on whatever the image ships.
      - run: rustup show
      # Without this every run compiled the whole dependency tree and all ten crates from cold. On a
      # representative pull request (run 40900996950) 728 s of this job's 882 s was its cargo steps.
      # Restoring `target/` and the registry leaves only the crates a change actually touched.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # `cache-all-crates` alone keeps only registry crates: the ten workspace crates, and the release addon
          # built further down that shares their artifacts, are discarded on save unless asked for.
          cache-all-crates: true
          cache-workspace-crates: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22", package-manager-cache: false}
      # rustup reads rust-toolchain.toml and installs the pinned toolchain on first use.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The suites are where this job's time goes: measured on four cores over the same 985 tests, `cargo test
      # --workspace` spent 382 s running them and `cargo nextest run --workspace` 161 s, because nextest
      # schedules every test binary at once instead of one after another. It runs the same binaries.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with: {tool: nextest@0.9.150}
      # Branded Chrome ignores --load-extension, so the extension backend's end-to-end test needs Chrome for Testing;
      # without one it skips.
      - name: Install Chrome for Testing
        run: |
          installed=$(npx -y @puppeteer/browsers@3.2.6 install chrome@stable --path "$RUNNER_TEMP/cft" --format '{{path}}')
          echo "FASTBROWSE_TEST_EXTENSION_CHROME=$installed" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace --locked --no-fail-fast
      # nextest does not run doctests.
      - run: cargo test --workspace --locked --doc
      # What the release publishes to crates.io, built from the packaged sources alone: a crate that reaches a file
      # outside its own directory, or names another without a version, fails here instead of at a release.
      # cargo treats a crate it verifies against as an immutable registry crate: it reuses an unpacked copy in
      # ~/.cargo/registry/src and a build in the target directory keyed on name and version alone. The cache above
      # restores both from other sources, so the check gets a target directory of its own and no unpacked copies.
      - run: rm -rf ~/.cargo/registry/src/*/fastbrowse*
      - run: >-
          cargo package --workspace --exclude fastbrowse-py --exclude fastbrowse-node --exclude fastbrowse-probe --locked
          --target-dir "$RUNNER_TEMP/package"
      # The Go client against the binary just built, its scripted runs standing in for the agent. Its types are
      # written from protocol/schema.json and committed; a schema changed without them fails here.
      - run: cargo build -p fastbrowse-cli --features scripted --locked
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go/go.mod, cache: false}
      - run: go -C go generate ./... && git diff --exit-code -- go
      - run: test -z "$(gofmt -l go)" && go -C go vet ./...
      - run: FASTBROWSE_TEST_BINARY="$PWD/target/debug/fastbrowse" go -C go test -race ./...
      # The Java client against the same binary. Its types are written from protocol/schema.json and committed too.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: {distribution: temurin, java-version: "17"}
      - run: python3 scripts/java_types.py && git diff --exit-code -- java && test -z "$(git status --porcelain -- java)"
      - run: FASTBROWSE_TEST_BINARY="$PWD/target/debug/fastbrowse" mvn -B -f java/pom.xml verify
      # The .NET client against the same binary, its types written from protocol/schema.json and committed too.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: {dotnet-version: "10.0.x"}
      - run: python3 scripts/dotnet_types.py && git diff --exit-code -- dotnet
      # From dotnet/, whose global.json picks the test runner xunit.v3 needs.
      - run: FASTBROWSE_TEST_BINARY="$PWD/../target/debug/fastbrowse" dotnet test --solution Fastbrowse.slnx
        working-directory: dotnet
      # Builds the package and its Rust core, `fastbrowse._native`, which the SDK suite's own server runs on.
      - run: uv sync --locked
      # A debug addon: these are behaviour checks, and the release addon, a full LTO build, is built and smoke-tested in
      # `binaries`. The release build took 86 s of this job on every run.
      - run: cargo build -p fastbrowse-node --locked
      - run: cp target/debug/libfastbrowse_node.so crates/fastbrowse-node/fastbrowse.node
      - run: node --test crates/fastbrowse-node/test/core.test.ts
      # The SDK suite again, its runs on the addon in this process instead of a fastbrowse process.
      - run: npm ci --ignore-scripts
      - run: FASTBROWSE_TEST_ADDON="$PWD/crates/fastbrowse-node/fastbrowse.node" npm run check:sdk

  # Every bench cassette replayed at zero latency, failing on any model request a cassette did not record. The proxy
  # has no upstream and the job no secrets, so a miss is an error, never a paid call. A change to model requests
  # refreshes the cassettes this reports with `bench fill`, a paid run a maintainer starts.
  replay:
    if: ${{ !inputs.task }}
    permissions: {contents: read}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {shared-key: python-core}
      - run: uv sync --locked
      # FASTBROWSE_CHROME makes the module use this Chrome, so it cannot skip for want of one.
      - name: Install Chrome for Testing
        run: |
          installed=$(npx -y @puppeteer/browsers@3.2.6 install chrome@stable --path "$RUNNER_TEMP/cft" --format '{{path}}')
          echo "FASTBROWSE_CHROME=$installed" >> "$GITHUB_ENV"
      - run: uv run pytest -q -m cassette_replay tests/browser/test_native_replay.py

  # The builds on their own runners cost more than the rest of CI together, so a pull request pays for them only
  # when it changes how they are built or packed (the toolchain, the profiles, the lockfile, the packaging and smoke
  # scripts, the SDK manifest the install smoke packs) or a file the binary compiles in (the page scripts, the
  # generated schemas), or carries the `build-binaries` label. A change to the code
  # alone is built on the push to `main`, which always builds, so a break still shows before a release. CI builds the
  # Linux and Windows targets; the two macOS ones, the costliest runners and the slowest to start, run in the release.
  changes:
    if: ${{ !inputs.task }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {contents: read}
    outputs:
      binaries: ${{ steps.built.outputs.binaries }}
      aur: ${{ steps.aur.outputs.aur }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # A pull request is checked out as its merge into the base, whose first parent is the base.
        with: {fetch-depth: 2, persist-credentials: false}
      - id: built
        env:
          EVENT: "${{ github.event_name }}"
          LABELLED: "${{ contains(github.event.pull_request.labels.*.name, 'build-binaries') }}"
        run: |
          if [ "$EVENT" != pull_request ] || [ "$LABELLED" = true ] || ! git diff --quiet HEAD^1 HEAD -- \
            .github/workflows/binaries.yml .github/workflows/ci.yml pyproject.toml \
            scripts/smoke_binary.py scripts/npm_platform_package.py scripts/smoke_npm_install.py \
            packages/sdk/package.json packages/sdk/tsconfig.json packages/sdk/tsconfig.build.json \
            Cargo.toml Cargo.lock rust-toolchain.toml 'crates/*/Cargo.toml' 'crates/*/build.rs' \
            crates/fastbrowse-browser/js crates/fastbrowse-browser/extension crates/fastbrowse-browser/assets \
            crates/fastbrowse-cli/generated
          then echo "binaries=true" >> "$GITHUB_OUTPUT"
          else echo "binaries=false" >> "$GITHUB_OUTPUT"
          fi
      # The Arch package builds sources PyPI already holds, so only its own files and the workflows that
      # build it can change what it does.
      - id: aur
        run: |
          if git diff --quiet HEAD^1 HEAD -- packaging/aur scripts/aur_package.py \
            .github/workflows/aur.yml .github/workflows/ci.yml .github/workflows/release.yml
          then echo "aur=false" >> "$GITHUB_OUTPUT"
          else echo "aur=true" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    needs: changes
    if: needs.changes.outputs.binaries == 'true'
    permissions: {contents: read}
    uses: ./.github/workflows/binaries.yml
    with: {macos: false}

  aur:
    needs: changes
    if: needs.changes.outputs.aur == 'true'
    permissions: {contents: read}
    uses: ./.github/workflows/aur.yml

  # `check` is the required status check, so its name must not move when the matrix gains a version.
  # It passes only when the Python matrix, secret scan, project rules, SDK, Rust and blog checks pass, and the binaries and the
  # Arch package each either passed or were left unbuilt by a change that could not alter them.
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [gate, evals, project-rules, sdk, rust, secrets, changes, replay, binaries, aur, blog]
    if: ${{ always() && !inputs.task }}
    steps:
      - env:
          GATE_RESULT: ${{ needs.gate.result }}
          EVALS_RESULT: ${{ needs.evals.result }}
          PROJECT_RULES_RESULT: ${{ needs.project-rules.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPLAY_RESULT: ${{ needs.replay.result }}
          BINARIES_RESULT: ${{ needs.binaries.result }}
          AUR_RESULT: ${{ needs.aur.result }}
          BLOG_RESULT: ${{ needs.blog.result }}
        run: |
          test "$GATE_RESULT" = success
          test "$EVALS_RESULT" = success
          test "$PROJECT_RULES_RESULT" = success
          test "$SDK_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SECRETS_RESULT" = success
          test "$CHANGES_RESULT" = success
          test "$REPLAY_RESULT" = success
          test "$BINARIES_RESULT" = success || test "$BINARIES_RESULT" = skipped
          test "$AUR_RESULT" = success || test "$AUR_RESULT" = skipped
          test "$BLOG_RESULT" = success

  realsite:
    if: ${{ inputs.task }}
    permissions: {contents: read}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - run: uv sync --locked
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Run the task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          TASK: ${{ inputs.task }}
          START: ${{ inputs.start }}
          ARGS: ${{ inputs.args }}
          MAX_DOLLARS: ${{ inputs.max_dollars }}
          MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          read -r -a extra <<< "$ARGS"
          start=()
          if [ -n "$START" ]; then start=(--start "$START"); fi
          uv run --no-sync fastbrowse "$TASK" "${start[@]}" --cloud --json --trace realsite.trace.jsonl \
            --record realsite.mp4 --max-dollars "$MAX_DOLLARS" --max-steps "$MAX_STEPS" "${extra[@]}" \
            > realsite.json 2> >(tee realsite.stderr.txt >&2)
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realsite-${{ github.run_id }}
          path: realsite.*
          if-no-files-found: warn

  # The posts in blog/ describe how the product reports, spends and clicks, so each one is bound in drift.lock to
  # the source that carries its claims. A change to a bound file that nobody re-verified turns this red, which is
  # the point: a post that reads as current while describing last release's behaviour is worse than no post.
  blog:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Pinned by version and verified by checksum: the binary decides whether a pull request may merge.
      - name: Install drift
        env:
          DRIFT_VERSION: 0.10.1
          DRIFT_SHA256: f4a027ca1f1f67cef1182d10c16ef183f8460c5f0cd5d5348d188c7fb2442a4e
        run: |
          archive="$RUNNER_TEMP/drift.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/fiberplane/drift/releases/download/v${DRIFT_VERSION}/drift-x86_64-linux.tar.gz"
          echo "$DRIFT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" drift
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Every doc bound in drift.lock, and every inline anchor outside it, against the tree as it stands. To clear
      # a failure: read the post against the change, fix it, then re-stamp it and bump its verifiedAgainst and
      # updated dates in the same commit.
      - run: drift check
