name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner --redact
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the latest. An embedder pinned to 3.13 (Nebula is) cannot install a package that
        # only builds on 3.14, and a floor no job runs stops being true within a release.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "${{ matrix.python }}"
      # The browser-use arm eval imports browser_use_sdk and the MCP server imports mcp; without the extras, ty
      # sees a different tree than we do.
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      # Prose is part of the product surface: ASCII punctuation everywhere, and Vale's wording rules on prose.
      # A release publishes its changelog entry, so the entry has to exist before the tag does.
      - run: uv run python scripts/changelog.py --check "$(uv version --short)"
      - run: uv run python scripts/no_slop.py
      - run: uv run vale sync
      - run: uv run vale README.md CHANGELOG.md AGENTS.md CONTRIBUTING.md docs src scripts tests
      - run: uv run pytest -q

  # `check` is the required status check, so its name must not move when the matrix gains a version.
  # It passes only when every leg of the matrix did.
  check:
    runs-on: ubuntu-latest
    needs: [gate]
    if: always()
    steps:
      - run: test "${{ needs.gate.result }}" = "success"

