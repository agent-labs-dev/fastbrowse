name: Official benchmarks

# Runs the upstream BU Bench and Online-Mind2Web task sources from Parallax on one fastbrowse build. The harness
# checkout at `harness_sha` supplies the plugin, while Parallax supplies task loading, browser evidence, retries,
# upstream grading, timing, costs and the run directory.
#
# Dispatch only, by hand or by the release workflow. Every task drives a real browser and real model calls, so this
# workflow spends money and is never triggered by a push or a pull request.
#
# A successful non-smoke job leaves two artifacts. `official-<suite>` is the encrypted private run. `official-run-<suite>`
# contains only the manifest, provenance, results and budget journal needed by benchmark-campaign.yml. Publication reads
# that run through the same TrialResult-to-Row mapping as internal campaigns and chooses the public group from the
# official task source recorded in the selection.
#
# `smoke` selects ten deterministic tasks from the source, one repeat each. `task_ids` selects the named task ids and
# also runs one repeat each. Both modes are diagnostic and never dispatch publication.
#
# Repository configuration checked before any paid call:
#   secrets: OPENROUTER_BENCHMARKS_API_KEY, OPENROUTER_JUDGE_API_KEY, PARALLAX_UPSTREAM_OPENAI_KEY,
#            LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, BROWSER_USE_API_KEY, HF_TOKEN
#   vars:    PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT, PARALLAX_JUDGE_BASE_URL, PARALLAX_JUDGE_MODELS
#
# `PARALLAX_UPSTREAM_OPENAI_KEY` is the preferred secret for the pinned upstream judge. The existing
# `OPENROUTER_JUDGE_API_KEY` remains the fallback. Parallax passes the selected value to each upstream checkout as
# OPENAI_API_KEY and OPENAI_BASE_URL.

on:
  workflow_dispatch:
    inputs:
      fastbrowse_ref:
        description: The fastbrowse commit the agent runs (a release tag or full sha)
        required: true
        type: string
      harness_sha:
        description: Full commit SHA of this repository whose evals/ runs the benchmarks; empty runs this workflow's commit
        required: false
        type: string
      suites:
        description: Which upstream suites to run
        required: true
        type: choice
        options: [all, bu-bench, online-mind2web]
        default: all
      repeat:
        description: Runs per task (at least 1)
        required: true
        default: "3"
      budget:
        description: Approved total dollars for each suite; it gates new trials
        required: true
        default: "600"
      reserve:
        description: Dollars Parallax reserves before each trial starts
        required: true
        default: "3"
      concurrency:
        description: Task workers per suite, sharing one Parallax budget ledger
        required: true
        default: "8"
      smoke:
        description: One repeat of 10 sampled tasks per suite to find bugs from traces; never publishable
        required: true
        type: boolean
        default: false
      task_ids:
        description: Space-separated task ids of one suite to run alone, one repeat each, as a smoke run; never publishable
        required: false
        type: string
        default: ""
      campaign_id:
        description: When set, dispatch the benchmark campaign of this name after every suite passes
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: official-benchmarks
  cancel-in-progress: false

env:
  UV_PYTHON: "3.13"
  SMOKE: ${{ inputs.smoke || inputs.task_ids != '' }}
  REPEAT: ${{ (inputs.smoke || inputs.task_ids != '') && '1' || inputs.repeat }}
  BUDGET: ${{ inputs.budget }}
  RESERVE: ${{ inputs.reserve }}
  WORKERS: ${{ inputs.concurrency }}

jobs:
  resolve:
    name: Resolve the pins and credentials
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read}
    outputs:
      fastbrowse_sha: ${{ steps.pins.outputs.fastbrowse_sha }}
      harness_sha: ${{ steps.pins.outputs.harness_sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate the dispatch
        env:
          SUITE_SET: ${{ inputs.suites }}
          TASK_IDS: ${{ inputs.task_ids }}
        run: |
          if [ -n "$TASK_IDS" ] && [ "$SUITE_SET" = all ]; then
            echo "::error::task_ids names tasks of one suite; choose that suite, not all"
            exit 1
          fi
          case "$SUITE_SET" in all|bu-bench|online-mind2web) ;; *) echo "::error::unknown suite '$SUITE_SET'"; exit 1 ;; esac
          for pair in "repeat:$REPEAT" "concurrency:$WORKERS"; do
            case "${pair#*:}" in ''|*[!0-9]*) echo "::error::${pair%%:*} must be an integer"; exit 1 ;; esac
          done
          test "$REPEAT" -ge 1 || { echo "::error::repeat must be at least 1"; exit 1; }
          test "$WORKERS" -ge 1 || { echo "::error::concurrency must be at least 1"; exit 1; }
          for pair in "budget:$BUDGET" "reserve:$RESERVE"; do
            case "${pair#*:}" in ''|*[!0-9.]*) echo "::error::${pair%%:*} must be a number"; exit 1 ;; esac
          done
      - name: Resolve the pins
        id: pins
        env:
          FASTBROWSE_REF: ${{ inputs.fastbrowse_ref }}
          HARNESS_SHA: ${{ inputs.harness_sha || github.sha }}
        run: |
          fastbrowse_sha="$(git rev-parse "${FASTBROWSE_REF}^{commit}")"
          printf '%s' "$fastbrowse_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::fastbrowse_ref did not resolve to a commit"; exit 1; }
          printf '%s' "$HARNESS_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::harness_sha must be a full 40 character lowercase commit SHA"; exit 1; }
          {
            echo "fastbrowse_sha=$fastbrowse_sha"
            echo "harness_sha=$HARNESS_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Check the credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_BENCHMARKS_API_KEY }}
          PARALLAX_UPSTREAM_OPENAI_KEY: ${{ secrets.PARALLAX_UPSTREAM_OPENAI_KEY || secrets.OPENROUTER_JUDGE_API_KEY }}
          PARALLAX_JUDGE_API_KEY: ${{ secrets.PARALLAX_UPSTREAM_OPENAI_KEY || secrets.OPENROUTER_JUDGE_API_KEY }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT: ${{ vars.PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT }}
          PARALLAX_JUDGE_BASE_URL: ${{ vars.PARALLAX_JUDGE_BASE_URL }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
          SUITE_SET: ${{ inputs.suites }}
        run: |
          missing=""
          need() { test -n "$2" || missing="$missing $1"; }
          need OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          need PARALLAX_UPSTREAM_OPENAI_KEY "$PARALLAX_UPSTREAM_OPENAI_KEY"
          need BROWSER_USE_API_KEY "$BROWSER_USE_API_KEY"
          need LANGFUSE_PUBLIC_KEY "$LANGFUSE_PUBLIC_KEY"
          need LANGFUSE_SECRET_KEY "$LANGFUSE_SECRET_KEY"
          need PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT "$PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT"
          need PARALLAX_JUDGE_BASE_URL "$PARALLAX_JUDGE_BASE_URL"
          need PARALLAX_JUDGE_MODELS "$PARALLAX_JUDGE_MODELS"
          if test "$SUITE_SET" != bu-bench; then need HF_TOKEN "$HF_TOKEN"; fi
          if test -n "$missing"; then
            echo "::error::missing repository configuration:$missing"
            exit 1
          fi
      - name: Build the suite matrix
        id: matrix
        env:
          SUITE_SET: ${{ inputs.suites }}
        run: |
          python3 - <<'PY'
          import json, os

          suites = {
              "bu-bench": {
                  "repository": "browser-use/benchmark",
                  "commit": "77b4df339fe8fc293fb48896cfa1c73dd743af42",
              },
              "online-mind2web": {
                  "repository": "OSU-NLP-Group/Online-Mind2Web",
                  "commit": "b422075b059f0bba670ddda168444eb1d326aa45",
              },
          }
          chosen = list(suites) if os.environ["SUITE_SET"] == "all" else [os.environ["SUITE_SET"]]
          matrix = [{"suite": name, **suites[name]} for name in chosen]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps(matrix)}\n")
          PY

  official:
    name: ${{ matrix.suite }}
    needs: resolve
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read, statuses: write}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      SUITE: ${{ matrix.suite }}
      OUT: ${{ github.workspace }}/runs/${{ matrix.suite }}
      PRIVATE_RUN: ${{ github.workspace }}/private-runs/${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.fastbrowse_sha }}
          path: fastbrowse
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.harness_sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Install the harness and fastbrowse
        env:
          FASTBROWSE_SHA: ${{ needs.resolve.outputs.fastbrowse_sha }}
        run: |
          cd harness/evals
          uv sync --locked --no-install-package fastbrowse
          # Install the measured commit after the harness environment, preserving its provenance for publication.
          uv pip install "fastbrowse @ git+file://$GITHUB_WORKSPACE/fastbrowse@$FASTBROWSE_SHA"
          uv run --no-sync python -c "import fastbrowse, fastbrowse_evals.publication"
      - name: Check out the pinned upstream judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: upstream/${{ matrix.suite }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the upstream judge in its own environment
        run: |
          cd "upstream/$SUITE"
          echo ".venv/" >> .git/info/exclude
          if test "$SUITE" = bu-bench; then
            uv sync --frozen --python 3.12
          else
            uv venv --python 3.11 .venv
            uv pip install --python .venv/bin/python -r requirements.txt
          fi
          test -z "$(git status --porcelain)" || {
            echo "::error::preparing the judge changed the pinned checkout"
            exit 1
          }
      - name: Check the artifact recipient
        env:
          RECIPIENT: ${{ vars.PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT }}
        run: |
          sudo apt-get install -y -qq age
          echo probe | age -r "$RECIPIENT" > /dev/null \
            || { echo "::error::PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT is not an age recipient"; exit 1; }
      - name: Run the Parallax official suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_BENCHMARKS_API_KEY }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          PARALLAX_LANGFUSE_PROJECT: fastbrowse-evals
          PARALLAX_JUDGE_BASE_URL: ${{ vars.PARALLAX_JUDGE_BASE_URL }}
          PARALLAX_JUDGE_API_KEY: ${{ secrets.PARALLAX_UPSTREAM_OPENAI_KEY || secrets.OPENROUTER_JUDGE_API_KEY }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
          PARALLAX_OFFICIAL_ONLINE_JUDGE_MODEL: ${{ vars.PARALLAX_OFFICIAL_ONLINE_JUDGE_MODEL }}
          PARALLAX_OFFICIAL_BU_BENCH_ROOT: ${{ github.workspace }}/upstream/bu-bench
          PARALLAX_OFFICIAL_BU_BENCH_JUDGE_PYTHON: ${{ github.workspace }}/upstream/bu-bench/.venv/bin/python
          PARALLAX_OFFICIAL_ONLINE_MIND2WEB_ROOT: ${{ github.workspace }}/upstream/online-mind2web
          PARALLAX_OFFICIAL_ONLINE_MIND2WEB_JUDGE_PYTHON: ${{ github.workspace }}/upstream/online-mind2web/.venv/bin/python
          FASTBROWSE_SHA: ${{ needs.resolve.outputs.fastbrowse_sha }}
          HARNESS_SHA: ${{ needs.resolve.outputs.harness_sha }}
          TASK_IDS: ${{ inputs.task_ids }}
        run: |
          cd harness/evals
          read -ra ids <<< "$TASK_IDS"
          if [ "${#ids[@]}" -gt 0 ]; then
            selection=("source=$SUITE" "${ids[@]}")
          elif [ "$SMOKE" = true ]; then
            mapfile -t task_ids < <(uv run --no-sync python - "$SUITE" <<'PY'
          import sys
          from parallax.task import source_tasks

          for task in source_tasks(source_names=(sys.argv[1],))[:10]:
              print(task.id)
          PY
          )
            selection=("source=$SUITE" "${task_ids[@]}")
          else
            selection=("$SUITE")
          fi
          # A full selection is `parallax run bu-bench ...` or `parallax run online-mind2web ...`.
          mkdir -p "$(dirname "$OUT")" "$PRIVATE_RUN"
          # `parallax run` uploads and removes a successful local run. Hard links preserve the private evidence while
          # the command is running, and a later step encrypts the mirror before it leaves the runner.
          python3 - "$OUT" "$PRIVATE_RUN" <<'PY' &
          import os
          import shutil
          import sys
          import time
          from pathlib import Path

          source, target = map(Path, sys.argv[1:])
          target.mkdir(parents=True, exist_ok=True)

          def mirror() -> None:
              if not source.is_dir():
                  return
              for path in source.rglob("*"):
                  if not path.is_file():
                      continue
                  destination = target / path.relative_to(source)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if destination.exists():
                      try:
                          if destination.stat().st_ino == path.stat().st_ino:
                              continue
                      except FileNotFoundError:
                          continue
                      temporary = destination.with_suffix(destination.suffix + ".tmp")
                      try:
                          shutil.copy2(path, temporary)
                          temporary.replace(destination)
                      except FileNotFoundError:
                          temporary.unlink(missing_ok=True)
                      continue
                  try:
                      os.link(path, destination)
                  except FileNotFoundError:
                      continue
                  except OSError:
                      try:
                          shutil.copy2(path, destination)
                      except FileNotFoundError:
                          pass

          while not source.exists():
              time.sleep(0.25)
          while source.exists():
              mirror()
              time.sleep(0.25)
          mirror()
          PY
          mirror_pid=$!
          set +e
          uv run --no-sync parallax run "${selection[@]}" \
            --harness fastbrowse \
            --repeats "$REPEAT" \
            --concurrency "$WORKERS" \
            --budget "$BUDGET" \
            --reserve "$RESERVE" \
            --retry-invalid 2 \
            --retry-wait 60 \
            --provenance "fastbrowse.group=$SUITE" \
            --out "$OUT"
          status=$?
          kill "$mirror_pid" 2> /dev/null || true
          wait "$mirror_pid" 2> /dev/null || true
          if test "$status" -eq 0; then
            run_id="$(jq -r .run_id "$PRIVATE_RUN/manifest.json")"
            jq -n --arg run_id "$run_id" '{verified: true, run_id: $run_id}' > "$PRIVATE_RUN/parallax-verify.json"
          fi
          set -e
          exit "$status"
      - name: Write the public run projection
        if: ${{ env.SMOKE != 'true' && success() }}
        run: |
          public="$RUNNER_TEMP/public-runs/$SUITE"
          mkdir -p "$public"
          for name in manifest.json provenance.json results.jsonl budget.jsonl parallax-verify.json; do
            test -f "$PRIVATE_RUN/$name" && cp "$PRIVATE_RUN/$name" "$public/$name"
          done
          test -f "$public/manifest.json" || { echo "::error::Parallax did not leave a manifest"; exit 1; }
          test -f "$public/results.jsonl" || { echo "::error::Parallax did not leave results"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.SMOKE != 'true' && success() }}
        with:
          name: official-run-${{ matrix.suite }}
          path: ${{ runner.temp }}/public-runs/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 90
      - name: Encrypt the private run mirror
        if: always()
        env:
          RECIPIENT: ${{ vars.PARALLAX_OFFICIAL_ARTIFACT_RECIPIENT }}
        run: |
          test -d "$PRIVATE_RUN" || { echo "::warning::no private run mirror was written"; exit 0; }
          tar -C "$(dirname "$PRIVATE_RUN")" -czf - "$(basename "$PRIVATE_RUN")" \
            | age -r "$RECIPIENT" -o "$RUNNER_TEMP/$SUITE.tar.gz.age"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-${{ matrix.suite }}
          path: ${{ runner.temp }}/${{ matrix.suite }}.tar.gz.age
          if-no-files-found: warn
          retention-days: 30

  campaign:
    name: Dispatch the campaign with these runs
    needs: [resolve, official]
    if: ${{ inputs.campaign_id != '' && !inputs.smoke && inputs.task_ids == '' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {actions: write}
    steps:
      - name: Dispatch the benchmark campaign
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          FASTBROWSE_REF: ${{ inputs.fastbrowse_ref }}
          HARNESS_SHA: ${{ needs.resolve.outputs.harness_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run benchmark-campaign.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f campaign_id="$CAMPAIGN_ID" -f fastbrowse_ref="$FASTBROWSE_REF" -f harness_sha="$HARNESS_SHA" \
            -f groups=all -f official_runs="$RUN_ID"
