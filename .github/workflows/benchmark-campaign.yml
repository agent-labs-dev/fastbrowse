name: Benchmark campaign

# Runs the live browser benchmark campaign (Parallax) for one fastbrowse build and publishes it to the site.
# Dispatch only, by hand or by the release workflow on a minor release: every run drives real browsers and real
# model calls, so it spends money and is never triggered by a push or a pull request. When every group has run,
# publish-evals.yml opens a pull request on agent-labs-dev/fastbrowse-site with the candidate and the site's group
# files; merging that pull request is the approval.
#
# The campaign code lives in agent-labs-dev/parallax (parallax.browser_use), pinned by `parallax_sha`. The
# fastbrowse repo does not depend on parallax, so this workflow checks the pinned parallax out beside fastbrowse
# with PARALLAX_DEPLOY_KEY, a read-only deploy key on agent-labs-dev/parallax.
#
# Groups:
#   fastbrowse    fastbrowse alone on every live suite task (internal-fastbrowse).
#   head-to-head  fastbrowse, the hosted Browser Use agent (browser-use), Browser Use Ultrafast (jev-ultrafast) and
#                 the Browserbase agent (browserbase) in one Parallax invocation, so every arm runs the same task set
#                 under one recorded protocol (published as internal-hosted). Ultrafast runs only the tasks of that
#                 set graded without an answer. Without Browserbase credentials the group runs without browserbase,
#                 and the site shows it as not measured; Browserbase reports no cost, so its rows carry none.
#                 Browser Harness (browser-harness: Codex CLI 0.163.0 with browser-harness 0.1.13 as its CLI and
#                 skill, GPT-6 Luna via OpenRouter, on a Browser Use Cloud browser) runs only the set's credential-free
#                 completion tasks; it needs no secret beyond BROWSER_USE_API_KEY and OPENROUTER_API_KEY.
#   all           both.
# `browser` picks the fastbrowse arm's browser: headless Chrome on the runner (local) or a Browser Use Cloud browser.
# The vendor arms always run on their own hosted browsers.
#
# Repository configuration this file needs (checked before any paid call):
#   secrets: PARALLAX_DEPLOY_KEY, OPENROUTER_API_KEY, AI_GATEWAY_API_KEY, PARALLAX_JUDGE_API_KEY,
#            LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY (the candidate reads the fixture run back)
#            BROWSER_USE_API_KEY (with `browser: cloud` or the head-to-head group)
#   secrets, optional: BROWSERBASE_API_KEY, BROWSERBASE_PROJECT_ID (the head-to-head group's browserbase arm)
#            FASTBROWSE_SITE_TOKEN (publish-evals.yml checks it when it opens the site pull request;
#            a campaign measured without it republishes with publish-evals.yml run_id)
#   vars, optional:    BROWSERBASE_PLAN, developer or startup: the account's plan, whose listed rates price its sessions
#   vars:    PARALLAX_JUDGE_BASE_URL, PARALLAX_JUDGE_MODELS
#
# `budget` is each group's approved total. It only gates whether the next run may start: a run holds its agent,
# browser and judge reserves (1 + 1 + 1 dollars, the browser 0 on local Chrome) while in flight, and starts only
# while everything committed plus that hold fits. At Parallax's default 8 runs in flight that is at most 24 dollars
# held, so the 300 dollar default leaves 276 for spend before a run waits, and a full campaign stops early only if
# its actual spend passes about 297 dollars.

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Campaign name recorded in the candidate and the site file name, e.g. release-0.8.0
        required: true
        type: string
      fastbrowse_ref:
        description: The fastbrowse commit the arms measure (a release tag or full sha)
        required: true
        type: string
      parallax_sha:
        description: Full 40 character commit SHA of agent-labs-dev/parallax to run
        required: true
        type: string
      groups:
        description: Which groups to run
        required: true
        type: choice
        options: [fastbrowse, head-to-head, all]
        default: all
      browser:
        description: The fastbrowse arm's browser, headless local Chrome on the runner or Browser Use Cloud
        required: true
        type: choice
        options: [local, cloud]
        default: local
      repeat:
        description: Runs per task (at least 3; a published comparison rests on three)
        required: true
        default: "3"
      budget:
        description: Approved total dollars for each group; it only gates new runs, see the header
        required: true
        default: "300"
      suites:
        description: Space separated Parallax suites
        required: true
        default: "core dev heldout stretch-dev stretch-heldout"

permissions: {}

# One campaign at a time: the groups share the approved spend and the cloud browser quota.
concurrency:
  group: benchmark-campaign
  cancel-in-progress: false

env:
  UV_PYTHON: "3.13"
  SUITES: ${{ inputs.suites }}
  REPEAT: ${{ inputs.repeat }}
  BUDGET: ${{ inputs.budget }}
  BROWSER: ${{ inputs.browser }}

jobs:
  resolve:
    name: Resolve the pins and the credentials
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read}
    outputs:
      fastbrowse_sha: ${{ steps.pins.outputs.fastbrowse_sha }}
      parallax_sha: ${{ steps.pins.outputs.parallax_sha }}
      run_on: ${{ steps.pins.outputs.run_on }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      # A quick dispatch cannot be the run a published comparison points at: fewer than three repeats is not a
      # rate. This fails before the credential check and before any paid call.
      - name: Require the full comparison protocol
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          case "$REPEAT" in
            ''|*[!0-9]*) echo "repeat must be an integer, got '$REPEAT'"; exit 1 ;;
          esac
          test "$REPEAT" -ge 3 || { echo "repeat must be at least 3, got $REPEAT"; exit 1; }
          case "$BUDGET" in
            ''|*[!0-9.]*) echo "budget must be a number, got '$BUDGET'"; exit 1 ;;
          esac
          # The site stores the candidate as data/benchmark-<campaign_id>.json.
          printf '%s' "$CAMPAIGN_ID" | grep -Eq '^[a-zA-Z0-9_.-]+$' \
            || { echo "::error::campaign_id may hold only letters, digits, '.', '_' and '-'"; exit 1; }
      - name: Resolve the pins
        id: pins
        env:
          FASTBROWSE_REF: ${{ inputs.fastbrowse_ref }}
          PARALLAX_SHA: ${{ inputs.parallax_sha }}
        run: |
          fastbrowse_sha="$(git rev-parse "${FASTBROWSE_REF}^{commit}")"
          printf '%s' "$fastbrowse_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::fastbrowse_ref did not resolve to a commit"; exit 1; }
          printf '%s' "$PARALLAX_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::parallax_sha must be a full 40 character lowercase commit SHA"; exit 1; }
          {
            echo "fastbrowse_sha=$fastbrowse_sha"
            echo "parallax_sha=$PARALLAX_SHA"
            echo "run_on=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
      - name: Check the credentials
        id: credentials
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_PLAN: ${{ vars.BROWSERBASE_PLAN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          PARALLAX_JUDGE_API_KEY: ${{ secrets.PARALLAX_JUDGE_API_KEY }}
          PARALLAX_JUDGE_BASE_URL: ${{ vars.PARALLAX_JUDGE_BASE_URL }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
          PARALLAX_DEPLOY_KEY: ${{ secrets.PARALLAX_DEPLOY_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          GROUP_SET: ${{ inputs.groups }}
        run: |
          missing=""
          need() { test -n "$2" || missing="$missing $1"; }
          need PARALLAX_DEPLOY_KEY "$PARALLAX_DEPLOY_KEY"
          need OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          need AI_GATEWAY_API_KEY "$AI_GATEWAY_API_KEY"
          need PARALLAX_JUDGE_API_KEY "$PARALLAX_JUDGE_API_KEY"
          need PARALLAX_JUDGE_BASE_URL "$PARALLAX_JUDGE_BASE_URL"
          need PARALLAX_JUDGE_MODELS "$PARALLAX_JUDGE_MODELS"
          need LANGFUSE_PUBLIC_KEY "$LANGFUSE_PUBLIC_KEY"
          need LANGFUSE_SECRET_KEY "$LANGFUSE_SECRET_KEY"
          if test "$BROWSER" = cloud || test "$GROUP_SET" != fastbrowse; then
            need BROWSER_USE_API_KEY "$BROWSER_USE_API_KEY"
          fi
          if test -n "$missing"; then
            echo "::error::missing repository configuration:$missing"
            exit 1
          fi
          browserbase=false
          if test -n "$BROWSERBASE_API_KEY" && test -n "$BROWSERBASE_PROJECT_ID" && test -n "$BROWSERBASE_PLAN"; then
            browserbase=true
          elif test "$GROUP_SET" != fastbrowse; then
            # An optional arm that cannot be measured is named here and skipped, never failed: the head-to-head still
            # measures the arms that do have credentials, and the summary says which one was left out and why.
            absent=""
            test -n "$BROWSERBASE_API_KEY" || absent="$absent BROWSERBASE_API_KEY(secret)"
            test -n "$BROWSERBASE_PROJECT_ID" || absent="$absent BROWSERBASE_PROJECT_ID(secret)"
            test -n "$BROWSERBASE_PLAN" || absent="$absent BROWSERBASE_PLAN(variable)"
            echo "::warning title=Browserbase arm skipped::the head-to-head runs without the browserbase arm; missing:$absent"
            {
              echo "### Arm skipped: browserbase"
              echo
              echo "The head-to-head group ran without the browserbase arm. The site shows it as not measured."
              echo
              echo "Missing repository configuration:$absent"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "browserbase=$browserbase" >> "$GITHUB_OUTPUT"
      - name: Build the group matrix
        id: matrix
        env:
          GROUP_SET: ${{ inputs.groups }}
          BROWSERBASE: ${{ steps.credentials.outputs.browserbase }}
        run: |
          vendors="browser-use jev-ultrafast browser-harness"
          if test "$BROWSERBASE" = true; then vendors="$vendors browserbase"; fi
          fastbrowse='{"label":"fastbrowse","key":"fastbrowse","arms":"fastbrowse","out":"internal-fastbrowse.jsonl"}'
          head_to_head="{\"label\":\"head-to-head\",\"key\":\"head-to-head\",\"arms\":\"fastbrowse $vendors\",\"out\":\"head-to-head.jsonl\"}"
          case "$GROUP_SET" in
            fastbrowse) include="[$fastbrowse]" ;;
            head-to-head) include="[$head_to_head]" ;;
            *) include="[$fastbrowse,$head_to_head]" ;;
          esac
          echo "matrix=$include" >> "$GITHUB_OUTPUT"
          {
            echo "### Campaign arms"
            echo
            echo "Groups: \`$GROUP_SET\`. Arms measured: \`fastbrowse\`"
            case "$GROUP_SET" in
              fastbrowse) ;;
              *) echo ", plus \`$vendors\` for the head-to-head group" ;;
            esac
            echo "."
          } >> "$GITHUB_STEP_SUMMARY"

  campaign:
    name: ${{ matrix.label }}
    needs: resolve
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read}
    # A full campaign is hours, not minutes, but a stuck cloud browser must not hold a runner for a day.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.fastbrowse_sha }}
          path: fastbrowse
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {python-version: "3.13"}
      - name: Check out the pinned parallax
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-labs-dev/parallax
          ref: ${{ needs.resolve.outputs.parallax_sha }}
          path: parallax
          # A read-only deploy key on agent-labs-dev/parallax, the private source this repository cannot read.
          ssh-key: ${{ secrets.PARALLAX_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install parallax and fastbrowse
        run: |
          cd parallax
          uv sync --locked --extra browser --extra track
          # Measure this fastbrowse build, not the one parallax pins. Every later command runs with --no-sync:
          # a syncing `uv run` would reinstall the pinned build over this one.
          uv pip install "$GITHUB_WORKSPACE/fastbrowse"
          uv run --no-sync python -c "import fastbrowse, parallax"
      # The browser-harness arm's agent; the arm checks this exact version before each attempt.
      - name: Install Codex for the Browser Harness arm
        if: ${{ matrix.key == 'head-to-head' }}
        run: npm install --global @openai/codex@0.163.0
      - name: Run the group
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          PARALLAX_JUDGE_API_KEY: ${{ secrets.PARALLAX_JUDGE_API_KEY }}
          PARALLAX_JUDGE_BASE_URL: ${{ vars.PARALLAX_JUDGE_BASE_URL }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
          BROWSERBASE_PLAN: ${{ vars.BROWSERBASE_PLAN }}
          ARMS: ${{ matrix.arms }}
          OUT: ${{ github.workspace }}/ledgers/${{ matrix.out }}
        run: |
          cd parallax
          mkdir -p "$(dirname "$OUT")"
          read -ra arms <<< "$ARMS"
          read -ra suites <<< "$SUITES"
          browser=()
          if test "$BROWSER" = local; then
            chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
            test -n "$chrome" || { echo "::error::browser local needs Chrome on the runner, and none was found"; exit 1; }
            browser=(--local-browser "$chrome")
            # Only a group with no hosted browser holds nothing for one; the vendor arms' browsers are billed.
            if test "${#arms[@]}" -eq 1; then browser+=(--browser-reserve-dollars 0); fi
          fi
          plan=()
          if [[ " ${arms[*]} " == *" browserbase "* ]]; then plan=(--browserbase-plan "$BROWSERBASE_PLAN"); fi
          uv run --no-sync parallax browser internal \
            --arms "${arms[@]}" \
            --suite "${suites[@]}" \
            --repeat "$REPEAT" \
            --budget "$BUDGET" \
            "${browser[@]}" \
            "${plan[@]}" \
            --out "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ledger-${{ matrix.key }}
          path: ledgers/
          if-no-files-found: warn
          retention-days: 30

  stage:
    name: Build the candidate
    needs: [resolve, campaign]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.fastbrowse_sha }}
          path: fastbrowse
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {python-version: "3.13"}
      - name: Check out the pinned parallax
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-labs-dev/parallax
          ref: ${{ needs.resolve.outputs.parallax_sha }}
          path: parallax
          # A read-only deploy key on agent-labs-dev/parallax, the private source this repository cannot read.
          ssh-key: ${{ secrets.PARALLAX_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install parallax and fastbrowse
        run: |
          cd parallax
          uv sync --locked --extra browser --extra track
          uv pip install "$GITHUB_WORKSPACE/fastbrowse"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {path: ledgers, pattern: ledger-*, merge-multiple: true}
      - name: Export the catalog
        run: |
          cd parallax
          uv run --no-sync parallax browser catalog "$GITHUB_WORKSPACE/catalog.json"
      - name: Find the fixture run
        id: fixture
        # The candidate binds to a passing Evals dispatch on the measured build. A release dispatches one beside this
        # campaign, so one still running is waited for rather than missed.
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_SHA: ${{ needs.resolve.outputs.fastbrowse_sha }}
        run: |
          latest() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow evals.yml --commit "$FIXTURE_SHA" \
              --event workflow_dispatch --limit 1 --json databaseId,status --jq ".[0] | $1 // empty"
          }
          run="$(latest .databaseId)"
          test -n "$run" || { echo "::error::no Evals dispatch on the measured build; dispatch evals.yml at it"; exit 1; }
          if test "$(latest .status)" != completed; then gh run watch "$run" --repo "$GITHUB_REPOSITORY" > /dev/null; fi
          conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          test "$conclusion" = success || { echo "::error::Evals run $run on the measured build ended $conclusion"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Build the candidate
        # This job runs only when every selected group finished, and the publication gate refuses a ledger whose
        # recorded arms differ from its group's.
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          FIXTURE_RUN: ${{ steps.fixture.outputs.run }}
          # The fixture run's traces are read back from fastbrowse's Langfuse project (evals/storage.py HOST).
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          cd parallax
          args=()
          for spec in \
            "$GITHUB_WORKSPACE/ledgers/internal-fastbrowse.jsonl:--internal-fastbrowse" \
            "$GITHUB_WORKSPACE/ledgers/head-to-head.jsonl:--hosted"; do
            path="${spec%%:*}"
            if test -f "$path"; then args+=("${spec##*:}" "$path"); fi
          done
          mkdir -p "$GITHUB_WORKSPACE/candidate"
          uv run --no-sync parallax browser publish-candidate \
            --campaign-id "$CAMPAIGN_ID" \
            --out "$GITHUB_WORKSPACE/candidate/benchmark-candidate.json" \
            --catalog "$GITHUB_WORKSPACE/catalog.json" \
            --fixture-run "$FIXTURE_RUN" \
            "${args[@]}"
      - name: Record the run facts
        # What the site shows beside the figures and the candidate does not hold: the run date, harness and judge.
        env:
          RUN_ON: ${{ needs.resolve.outputs.run_on }}
          PARALLAX_SHA: ${{ needs.resolve.outputs.parallax_sha }}
          PARALLAX_JUDGE_BASE_URL: ${{ vars.PARALLAX_JUDGE_BASE_URL }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
        run: |
          jq -n --arg run_on "$RUN_ON" --arg harness "Parallax at ${PARALLAX_SHA:0:7}" \
            --arg judge "$PARALLAX_JUDGE_MODELS through $PARALLAX_JUDGE_BASE_URL" \
            '{run_on: $run_on, harness: $harness, judge: $judge}' > "$GITHUB_WORKSPACE/candidate/run-facts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Open the site pull request
    needs: stage
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-evals.yml
    secrets:
      FASTBROWSE_SITE_TOKEN: ${{ secrets.FASTBROWSE_SITE_TOKEN }}
