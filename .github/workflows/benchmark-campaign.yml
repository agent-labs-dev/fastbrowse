name: Benchmark campaign
# The campaign id ends the run's title, which is how the release gate finds `release-<version>`.
run-name: Benchmark campaign ${{ inputs.campaign_id || github.event.client_payload.campaign_id }}

# Runs the live browser benchmark campaign (Parallax) for one fastbrowse build and publishes it to the site.
# Dispatch only, by hand, by the release workflow on a minor release, or by a repository_dispatch from an integration:
# every run drives real browsers and real model calls, so it spends money and is never triggered by a push or a pull
# request. When every group has run,
# publish-evals.yml opens a pull request on agent-labs-dev/fastbrowse-site with the candidate and the site's group
# files; merging that pull request is the approval. Each group's Parallax run directory is uploaded from its own job,
# finished or not, and "Re-run failed jobs" repeats it from the run artifact.
#
# `official_runs` names finished Official benchmarks runs of the same `fastbrowse_ref` and `harness_sha`. Their
# sanitized Parallax run directories join this candidate as the bu-bench and online-mind2web groups: the site reads one
# candidate, so every group in it must come from one build. Run them first; this workflow neither starts nor waits for them.
#
# The campaign code is `evals/` in this repository (fastbrowse_evals, a Parallax plugin) at `harness_sha`, checked
# out beside the measured build so the harness and the build can be different commits.
#
# Groups:
#   fastbrowse    fastbrowse alone on every live suite task (internal-fastbrowse).
#   head-to-head  fastbrowse in one Parallax invocation with any competitor run live beside it (published as
#                 internal-hosted). Each arm runs every task it can attempt; the catalog states why it skips the others.
#   all           both.
# `extra_arms` adds arms beside them. `fastbrowse-pool` only in a smoke. `fastbrowse-hosted`, our own product's
# public API as a customer calls it, may join a real campaign, and then always as its own group writing
# `fastbrowse-hosted.jsonl`: publication's internal groups accept a fixed arm set, so its rows must never enter a
# published group. It is a diagnostic - its dollars are the customer charge rather than metered provider cost, and
# the API returns no copy of the final page, so the page half of a task is ungraded - and no step reads that run
# into a candidate. A failure there is reported on the run but does not block publication, so it costs a rerun only
# if its own rows are wanted; every published group still fails the campaign.
# The budget gates new attempts; Parallax gives no task time, step or dollar limit to an active arm.
# Browser Use (its default model and bu-ultrafast) and Browser Harness are not run by default. Set
# `refresh_competitors` or name them in `head_to_head_arms` to measure them in the current campaign.
#
# `refresh_competitors` adds all three to the head-to-head group for one full dispatch. Browser Harness drives a Browser
# Use Cloud browser through the Codex CLI on gpt-6-luna, installed only for a dispatch that runs it.
#
# `head_to_head_arms` runs exactly the arms it names in the head-to-head group, fastbrowse included only if named, to
# re-measure some arms alone. The candidate takes every other arm's rows from the campaign's earlier runs (below), each
# run's build named beside its rows.
#
# Repository configuration this file needs (checked before any paid call):
#   secrets: OPENROUTER_BENCHMARKS_API_KEY (as FASTBROWSE_OPENROUTER_API_KEY), OPENROUTER_JUDGE_API_KEY (as PARALLAX_JUDGE_API_KEY),
#            BROWSER_USE_API_KEY
#   secrets when `extra_arms` names fastbrowse-hosted: FASTBROWSE_HOSTED_API_KEY (its own submit would otherwise
#            fail one attempt at a time, after the paid groups had started)
#   secrets, optional: FASTBROWSE_SITE_TOKEN (publish-evals.yml checks it when it opens the site pull request;
#            a campaign measured without it republishes with publish-evals.yml run_id)
#   vars:    PARALLAX_JUDGE_BASE_URL, PARALLAX_JUDGE_MODELS
#
# `smoke` finds bugs before a release: one repeat of every task in the chosen group (`groups: all` means the head-to-head
# group, which holds both arms), and no candidate or site pull request, so it can never publish.
#
# The candidate takes each task from the newest finished run of this campaign that measured it in full, as the release
# gate scores it, so a late fix reruns only the tasks it affects (`only`) and its stage combines that run with the
# earlier ones. `candidate_only` runs nothing and builds the candidate from the campaign's finished runs alone; its
# `fastbrowse_ref` is the newest run's build in the campaign's Parallax run artifacts.
#
# `budget` is each group's approved total. It only gates whether the next run may start: a run holds its agent,
# browser and judge reserves (1 + 1 + 1 dollars) while in flight, and starts only
# while everything committed plus that hold fits. At Parallax's default 8 runs in flight that is at most 24 dollars
# held, so the 300 dollar default leaves 276 for spend before a run waits, and a full campaign stops early only if
# its actual spend passes about 297 dollars.

on:
  # The same run, started by an integration that can write the repository but not dispatch workflows (a GitHub
  # App without actions: write): POST /repos/{repo}/dispatches with event_type benchmark-campaign and the inputs
  # below as client_payload. Every value reaches the steps through env, as a dispatch input does.
  repository_dispatch:
    types: [benchmark-campaign]
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Campaign name recorded in the candidate and the site file name, e.g. release-0.8.0
        required: true
        type: string
      fastbrowse_ref:
        description: The fastbrowse commit the arms measure (a release tag or full sha)
        required: true
        type: string
      harness_sha:
        description: Full commit SHA of this repository whose evals/ runs the campaign; empty runs this workflow's commit
        required: false
        type: string
      groups:
        description: Which groups to run
        required: true
        type: choice
        options: [fastbrowse, head-to-head, all]
        default: all
      repeat:
        description: Runs per task (at least 3; a published comparison rests on three)
        required: true
        default: "3"
      budget:
        description: Approved total dollars for each group; it only gates new runs, see the header
        required: true
        default: "300"
      reserve:
        description: Dollars Parallax reserves before each trial starts
        required: true
        default: "3"
      suites:
        description: Space separated Parallax suites
        required: true
        default: "core dev stretch-dev"
      smoke:
        description: One repeat to find bugs from traces. Never publishable; with groups all it runs the head-to-head group
        required: true
        type: boolean
        default: false
      refresh_competitors:
        description: Also run Browser Use and Browser Harness live in this campaign. A smoke writes none. Needs the head-to-head group
        required: true
        type: boolean
        default: false
      official_runs:
        description: Space separated Official benchmarks run ids of this build whose public rows join the candidate
        required: false
        type: string
        default: ""
      only:
        description: Space separated task ids of the chosen suites to run instead of all of them. Outside a smoke it reruns the tasks a fix affects, and the candidate takes the other tasks from the campaign's earlier runs
        required: false
        type: string
        default: ""
      candidate_only:
        description: Run nothing; build the candidate from this campaign's finished runs. fastbrowse_ref is the newest run's build
        required: false
        type: boolean
        default: false
      concurrency:
        description: Runs in flight at once for every group; empty keeps the default of 8. Each invocation and physical attempt records the selected concurrency
        required: false
        type: string
        default: ""
      head_to_head_arms:
        description: Space separated arms the head-to-head group runs instead of its default ones, from fastbrowse, browser-use, browser-use-ultrafast, browser-harness and browser-use-oss (browser-use 1.0 on its defaults, never a default arm); the candidate takes the others from the campaign's earlier runs
        required: false
        type: string
        default: ""
      extra_arms:
        description: Space separated arms added to every chosen group, from fastbrowse-pool and fastbrowse-hosted. fastbrowse-pool needs smoke; fastbrowse-hosted runs in a real campaign as its own diagnostic group
        required: false
        type: string
        default: ""

permissions: {}

# One run per campaign at a time; different campaigns run side by side. Each dispatch checks the OpenRouter key holds
# its own approved budget, so campaigns started together must fit in what the key has left between them, and the
# cloud browser quota is shared by any that run head-to-head.
concurrency:
  group: benchmark-campaign-${{ inputs.campaign_id || github.event.client_payload.campaign_id }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.13"
  CAMPAIGN_ID: ${{ inputs.campaign_id || github.event.client_payload.campaign_id }}
  SUITES: ${{ inputs.suites || github.event.client_payload.suites || 'core dev stretch-dev' }}
  # A smoke run has one repeat whatever `repeat` says.
  REPEAT: ${{ (inputs.smoke || github.event.client_payload.smoke == true) && '1' || inputs.repeat || github.event.client_payload.repeat || '3' }}
  BUDGET: ${{ inputs.budget || github.event.client_payload.budget || '300' }}
  RESERVE: ${{ inputs.reserve || github.event.client_payload.reserve || '3' }}
  SMOKE: ${{ inputs.smoke || github.event.client_payload.smoke == true }}
  REFRESH: ${{ inputs.refresh_competitors || github.event.client_payload.refresh_competitors == true }}
  GROUPS_CHOSEN: ${{ inputs.groups || github.event.client_payload.groups || 'all' }}
  OFFICIAL_RUNS: ${{ inputs.official_runs || github.event.client_payload.official_runs || '' }}
  ONLY: ${{ inputs.only || github.event.client_payload.only || '' }}
  RUN_CONCURRENCY: ${{ inputs.concurrency || github.event.client_payload.concurrency || '' }}
  EXTRA_ARMS: ${{ inputs.extra_arms || github.event.client_payload.extra_arms || '' }}
  HEAD_TO_HEAD_ARMS: ${{ inputs.head_to_head_arms || github.event.client_payload.head_to_head_arms || '' }}
  CANDIDATE_ONLY: ${{ inputs.candidate_only || github.event.client_payload.candidate_only == true }}

jobs:
  resolve:
    name: Resolve the pins and the credentials
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read, actions: read}
    outputs:
      fastbrowse_sha: ${{ steps.pins.outputs.fastbrowse_sha }}
      harness_sha: ${{ steps.pins.outputs.harness_sha }}
      run_on: ${{ steps.pins.outputs.run_on }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      # A quick dispatch cannot be the run a published comparison points at: fewer than three repeats is not a
      # rate. This fails before the credential check and before any paid call. A smoke run has its one repeat
      # because its stage and publish jobs never run.
      - name: Require the full comparison protocol
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id || github.event.client_payload.campaign_id }}
          # The env block above reads a 0 or an empty value as unset, so a payload is checked as it was sent.
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          case "$GROUPS_CHOSEN" in
            fastbrowse|head-to-head|all) ;;
            *) echo "::error::groups must be fastbrowse, head-to-head or all, got '$GROUPS_CHOSEN'"; exit 1 ;;
          esac
          if test "$CANDIDATE_ONLY" = true && test "$SMOKE" = true; then
            echo "::error::a smoke builds no candidate, so candidate_only cannot be a smoke"; exit 1
          fi
          if test "$REFRESH" = true && test "$GROUPS_CHOSEN" = fastbrowse; then
            echo "::error::refresh_competitors needs the head-to-head group"; exit 1
          fi
          # Each word names a task-source suite that the run step translates to task ids.
          read -ra chosen <<< "$SUITES"
          test "${#chosen[@]}" -gt 0 || { echo "::error::suites names no suite"; exit 1; }
          for suite in "${chosen[@]}"; do
            case "$suite" in
              core|dev|stretch-dev) ;;
              # A diagnostic suite is outside the catalog, so only a smoke, which publishes nothing, may run it.
              sweep) test "$SMOKE" = true || { echo "::error::suite '$suite' is diagnostic and needs smoke"; exit 1; } ;;
              *) echo "::error::suites must be core, dev, stretch-dev or (smoke only) sweep, got '$suite'"; exit 1 ;;
            esac
          done
          for key in groups suites; do
            # The env block reads an empty value as unset, which would widen a paid run to the default.
            jq -e --arg key "$key" '(. // {})[$key] != ""' <<< "$PAYLOAD" > /dev/null \
              || { echo "::error::$key in client_payload is empty"; exit 1; }
          done
          for key in smoke refresh_competitors candidate_only; do
            # Only a JSON true turns these on, so a string "true" would quietly start a full paid run.
            jq -e --arg key "$key" '(. // {})[$key] | . == null or type == "boolean"' <<< "$PAYLOAD" > /dev/null \
              || { echo "::error::$key in client_payload must be true or false"; exit 1; }
          done
          for key in repeat budget reserve; do
            # A workflow_dispatch has no payload, which reads as null here.
            jq -e --arg key "$key" '. // {} | has($key) | not' <<< "$PAYLOAD" > /dev/null && continue
            jq -e --arg key "$key" '.[$key] | tonumber? // 0 | . > 0' <<< "$PAYLOAD" > /dev/null \
              || { echo "::error::$key in client_payload must be above 0"; exit 1; }
          done
          case "$REPEAT" in
            ''|*[!0-9]*) echo "repeat must be an integer, got '$REPEAT'"; exit 1 ;;
          esac
          if test "$SMOKE" != true; then
            test "$REPEAT" -ge 3 || { echo "repeat must be at least 3, got $REPEAT"; exit 1; }
          fi
          case "$BUDGET" in
            ''|*[!0-9.]*) echo "budget must be a number, got '$BUDGET'"; exit 1 ;;
          esac
          case "$RESERVE" in
            ''|*[!0-9.]*) echo "reserve must be a number, got '$RESERVE'"; exit 1 ;;
          esac
          case "$OFFICIAL_RUNS" in
            *[!0-9\ ]*) echo "::error::official_runs must be run ids separated by spaces"; exit 1 ;;
          esac
          # `only` may narrow a release run: the gate scores each task on its newest run.
          # The hosted API writes a diagnostic run; the pool changes a published group's browser and stays
          # smoke-only. Concurrency applies to every group and is recorded with its invocation and attempts.
          if test "$SMOKE" != true && test -n "$EXTRA_ARMS"; then
            for arm in $EXTRA_ARMS; do
              case "$arm" in
                fastbrowse-hosted) ;;
                *) echo "::error::extra_arms outside a smoke may only name fastbrowse-hosted, got '$arm'"; exit 1 ;;
              esac
            done
          fi
          if test -n "$HEAD_TO_HEAD_ARMS" && test "$GROUPS_CHOSEN" != head-to-head; then
            echo "::error::head_to_head_arms needs groups head-to-head"; exit 1
          fi
          for arm in $HEAD_TO_HEAD_ARMS; do
            case "$arm" in
              fastbrowse|browser-use|browser-use-ultrafast|browser-harness|browser-use-oss) ;;
              *) echo "::error::head_to_head_arms takes fastbrowse, browser-use, browser-use-ultrafast, browser-harness and browser-use-oss, got '$arm'"; exit 1 ;;
            esac
          done
          for arm in $EXTRA_ARMS; do
            case "$arm" in
              fastbrowse-pool|fastbrowse-hosted) ;;
              *) echo "::error::extra_arms takes fastbrowse-pool and fastbrowse-hosted, got '$arm'"; exit 1 ;;
            esac
          done
          case "$ONLY" in
            *[!a-z0-9\ -]*) echo "::error::only must be task ids separated by spaces"; exit 1 ;;
          esac
          # A numeric zero in repository_dispatch would otherwise read as unset in the environment expression.
          jq -e '(. // {}) | if has("concurrency") and .concurrency != "" then
            .concurrency | tostring | test("^[0-9]*[1-9][0-9]*$") else true end' <<< "$PAYLOAD" > /dev/null \
            || { echo "::error::concurrency in client_payload must be a positive integer"; exit 1; }
          case "$RUN_CONCURRENCY" in
            '') ;;
            *[!0-9]*) echo "::error::concurrency must be a positive integer, got '$RUN_CONCURRENCY'"; exit 1 ;;
            *[1-9]*) ;;
            *) echo "::error::concurrency must be a positive integer, got '$RUN_CONCURRENCY'"; exit 1 ;;
          esac
          # The site stores the candidate as data/benchmark-<campaign_id>.json.
          printf '%s' "$CAMPAIGN_ID" | grep -Eq '^[a-zA-Z0-9_.-]+$' \
            || { echo "::error::campaign_id may hold only letters, digits, '.', '_' and '-'"; exit 1; }
      - name: Resolve the pins
        id: pins
        env:
          FASTBROWSE_REF: ${{ inputs.fastbrowse_ref || github.event.client_payload.fastbrowse_ref }}
          HARNESS_SHA: ${{ inputs.harness_sha || github.event.client_payload.harness_sha || github.sha }}
        run: |
          fastbrowse_sha="$(git rev-parse "${FASTBROWSE_REF}^{commit}")"
          printf '%s' "$fastbrowse_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::fastbrowse_ref did not resolve to a commit"; exit 1; }
          printf '%s' "$HARNESS_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::harness_sha must be a full 40 character lowercase commit SHA"; exit 1; }
          {
            echo "fastbrowse_sha=$fastbrowse_sha"
            echo "harness_sha=$HARNESS_SHA"
            echo "run_on=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
      - name: Check the credentials
        id: credentials
        # A candidate built from earlier runs spends nothing and skips this check.
        if: ${{ env.CANDIDATE_ONLY != 'true' }}
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          FASTBROWSE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_BENCHMARKS_API_KEY }}
          PARALLAX_JUDGE_API_KEY: ${{ secrets.OPENROUTER_JUDGE_API_KEY }}
          PARALLAX_JUDGE_BASE_URL: ${{ vars.PARALLAX_JUDGE_BASE_URL }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          FASTBROWSE_HOSTED_API_KEY: ${{ secrets.FASTBROWSE_HOSTED_API_KEY }}
        run: |
          missing=""
          need() { test -n "$2" || missing="$missing $1"; }
          need FASTBROWSE_OPENROUTER_API_KEY "$FASTBROWSE_OPENROUTER_API_KEY"
          need PARALLAX_JUDGE_API_KEY "$PARALLAX_JUDGE_API_KEY"
          need PARALLAX_JUDGE_BASE_URL "$PARALLAX_JUDGE_BASE_URL"
          need PARALLAX_JUDGE_MODELS "$PARALLAX_JUDGE_MODELS"
          need LANGFUSE_PUBLIC_KEY "$LANGFUSE_PUBLIC_KEY"
          need LANGFUSE_SECRET_KEY "$LANGFUSE_SECRET_KEY"
          need BROWSER_USE_API_KEY "$BROWSER_USE_API_KEY"
          # Only a campaign that named our hosted arm needs its key; it is what the hosted group's first submit
          # would otherwise fail on, one attempt at a time, after the paid groups had already started.
          case " $EXTRA_ARMS " in
            *" fastbrowse-hosted "*) need FASTBROWSE_HOSTED_API_KEY "$FASTBROWSE_HOSTED_API_KEY" ;;
          esac
          if test -n "$missing"; then
            echo "::error::missing repository configuration:$missing"
            exit 1
          fi
          groups=1
          if test "$GROUPS_CHOSEN" = all && test "$SMOKE" != true; then groups=2; fi
          # The hosted diagnostic group spends too, on the same OpenRouter key for its steps and its judge.
          case " $EXTRA_ARMS " in *" fastbrowse-hosted "*) groups=$((groups + 1)) ;; esac
          # Both keys must cover every group before browsers begin billing.
          for key in "$FASTBROWSE_OPENROUTER_API_KEY" "$PARALLAX_JUDGE_API_KEY"; do
            KEY="$key" NEED="$(python3 -c "print($BUDGET * $groups)")" python3 - <<'PYTHON'
          import json, os, sys, urllib.request

          request = urllib.request.Request("https://openrouter.ai/api/v1/key",
                                           headers={"Authorization": f"Bearer {os.environ['KEY']}"})
          with urllib.request.urlopen(request, timeout=30) as reply:
              left = json.load(reply)["data"].get("limit_remaining")
          need = float(os.environ["NEED"])
          if left is not None and left < need:
              sys.exit(f"::error::the OpenRouter key has {left:.2f} dollars left, the approved budget needs {need:.2f}")
          PYTHON
          done
      - name: Build the group matrix
        id: matrix
        env:
          GROUP_SET: ${{ env.SMOKE == 'true' && env.GROUPS_CHOSEN == 'all' && 'head-to-head' || env.GROUPS_CHOSEN }}
        run: |
          paired="fastbrowse"
          if test "$REFRESH" = true; then paired="$paired browser-use browser-use-ultrafast browser-harness"; fi
          # Words only: the validation step admitted nothing but arm names.
          if test -n "$HEAD_TO_HEAD_ARMS"; then read -ra named <<< "$HEAD_TO_HEAD_ARMS"; paired="${named[*]}"; fi
          # `fastbrowse-hosted` never joins a published group: each internal group's arm set is fixed in the
          # publication gate, so its rows would refuse the candidate. It always gets its own run, which no
          # candidate step reads.
          extra=""
          hosted=""
          for arm in $EXTRA_ARMS; do
            if test "$arm" = fastbrowse-hosted; then hosted="fastbrowse-hosted"; else extra="$extra $arm"; fi
          done
          # Every group takes the dispatch setting; empty leaves the harness default of 8.
          fastbrowse="{\"label\":\"fastbrowse\",\"key\":\"fastbrowse\",\"group\":\"internal-fastbrowse\",\"arms\":\"fastbrowse$extra\",\"conc\":\"$RUN_CONCURRENCY\",\"out\":\"internal-fastbrowse\"}"
          head_to_head="{\"label\":\"head-to-head\",\"key\":\"head-to-head\",\"group\":\"internal-hosted\",\"arms\":\"$paired$extra\",\"conc\":\"$RUN_CONCURRENCY\",\"out\":\"internal-hosted\"}"
          hosted_group=""
          test -z "$hosted" || hosted_group=",{\"label\":\"hosted\",\"key\":\"hosted\",\"group\":\"fastbrowse-hosted\",\"arms\":\"fastbrowse-hosted\",\"conc\":\"$RUN_CONCURRENCY\",\"out\":\"fastbrowse-hosted\"}"
          case "$GROUP_SET" in
            fastbrowse) include="[$fastbrowse$hosted_group]" ;;
            head-to-head) include="[$head_to_head$hosted_group]" ;;
            *) include="[$fastbrowse,$head_to_head$hosted_group]" ;;
          esac
          echo "matrix=$include" >> "$GITHUB_OUTPUT"
          {
            echo "### Campaign arms"
            echo
            echo "Groups: \`$GROUP_SET\`. Concurrency: \`${RUN_CONCURRENCY:-8}\`."
            case "$GROUP_SET" in
              fastbrowse) ;;
              *) echo "Head-to-head arms: \`$paired$extra\`." ;;
            esac
            # Named as a diagnostic where a reader first sees the arms, so its run is never read as a
            # like-for-like row: customer charge rather than metered cost, and the page half is ungraded.
            test -z "$hosted" || echo "Diagnostic group \`hosted\`: \`fastbrowse-hosted\` (our own hosted API, customer charge, page half ungraded; not published)."
          } >> "$GITHUB_STEP_SUMMARY"

  campaign:
    name: ${{ matrix.label }}
    needs: resolve
    if: ${{ !(inputs.candidate_only || github.event.client_payload.candidate_only == true) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # id-token: the fastbrowse-pool arm signs in to GCP to reach the browser pool.
    permissions: {contents: read, statuses: write, id-token: write}
    # A full campaign is hours, not minutes, but a stuck cloud browser must not hold a runner for a day.
    timeout-minutes: 350
    # The hosted diagnostic never decides whether a campaign may publish: its run is in no candidate, so its
    # failure is reported on the run and does not skip the stage job. Every published group still fails the run.
    continue-on-error: ${{ matrix.label == 'hosted' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      OUT: ${{ github.workspace }}/runs/${{ matrix.out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.fastbrowse_sha }}
          path: fastbrowse
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.harness_sha }}
          path: harness
          persist-credentials: false
      - name: Install the harness and fastbrowse
        env:
          FASTBROWSE_SHA: ${{ needs.resolve.outputs.fastbrowse_sha }}
        run: |
          cd harness/evals
          # The lock pins fastbrowse to the harness checkout; the measured build replaces it. Every later command runs
          # with --no-sync: a syncing `uv run` would put the harness's own fastbrowse back.
          uv sync --locked --no-install-package fastbrowse
          # The package metadata records the measured build, and publication checks the run provenance.
          uv pip install "fastbrowse @ git+file://$GITHUB_WORKSPACE/fastbrowse@$FASTBROWSE_SHA"
          uv pip install "parallax-evals[browser] @ git+https://github.com/agent-labs-dev/parallax@2a16cbddf615c82a8b4b23f62d132231079446e5"
          uv run --no-sync python -c "import fastbrowse, fastbrowse_evals.live"
      # Parallax supplies the competitor harnesses and their pin checks. The plugin only adds the
      # fastbrowse-specific harnesses below.
      - name: Fetch the progress reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: scripts/eval_progress.py
          persist-credentials: false
      # The token stays out of the suite's step: a job's logs are unreadable until it ends, so this is the live view.
      - name: Report progress
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ inputs.campaign_id || github.event.client_payload.campaign_id }}
        # Campaigns run side by side on one harness commit, so each reports under its own campaign id.
        run: nohup python3 ci/scripts/eval_progress.py "$OUT" "$CAMPAIGN_ID / ${{ matrix.label }}" > /dev/null 2>&1 &
      # The pool serves fastbrowse-hosted's customers and is reachable only inside its cluster, so it is never
      # exposed: this job signs in as fastbrowse-evals-pool, which may only port-forward to the pool in its namespace
      # and read the pool's token, and leases through the forward.
      - name: Sign in to the browser pool's project
        if: ${{ contains(env.EXTRA_ARMS, 'fastbrowse-pool') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/173247957816/locations/global/workloadIdentityPools/github-pool/providers/github-fastbrowse
          service_account: fastbrowse-evals-pool@fastbrowse-hosted.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: ${{ contains(env.EXTRA_ARMS, 'fastbrowse-pool') }}
        with: {install_components: "gke-gcloud-auth-plugin,kubectl"}
      - name: Forward the browser pool
        if: ${{ contains(env.EXTRA_ARMS, 'fastbrowse-pool') }}
        run: |
          gcloud container clusters get-credentials fastbrowse-pool --zone us-central1-a --project fastbrowse-hosted
          nohup kubectl -n fastbrowse port-forward svc/browser-pool 18090:8090 > "$RUNNER_TEMP/pool-forward.log" 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:18090/ && break; sleep 1; done
          token="$(gcloud secrets versions access latest --secret FBH_BROWSER_POOL_TOKEN --project fastbrowse-hosted)"
          echo "::add-mask::$token"
          { echo "FASTBROWSE_POOL_URL=http://127.0.0.1:18090"; echo "FASTBROWSE_POOL_TOKEN=$token"; } >> "$GITHUB_ENV"
      - name: Run the group
        env:
          FASTBROWSE_HOSTED_API_KEY: ${{ secrets.FASTBROWSE_HOSTED_API_KEY }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          FASTBROWSE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_BENCHMARKS_API_KEY }}
          PARALLAX_JUDGE_API_KEY: ${{ secrets.OPENROUTER_JUDGE_API_KEY }}
          PARALLAX_JUDGE_BASE_URL: ${{ vars.PARALLAX_JUDGE_BASE_URL }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          PARALLAX_LANGFUSE_PROJECT: fastbrowse-evals
          # The demo logins each practice site prints on its own login page. They are public, so they live here
          # rather than in repository secrets; they are still task secrets, scoped to the start origin and scrubbed
          # from evidence.
          FASTBROWSE_EVAL_SAUCEDEMO_USERNAME: standard_user
          FASTBROWSE_EVAL_SAUCEDEMO_PASSWORD: secret_sauce
          FASTBROWSE_EVAL_EXPANDTESTING_USERNAME: practice
          FASTBROWSE_EVAL_EXPANDTESTING_PASSWORD: SuperSecretPassword!
          FASTBROWSE_EVAL_PRACTICE_USERNAME: student
          FASTBROWSE_EVAL_PRACTICE_PASSWORD: Password123
          ARMS: ${{ matrix.arms }}
          GROUP: ${{ matrix.group }}
        run: |
          cd harness/evals
          mkdir -p "$(dirname "$OUT")"
          read -ra arms <<< "$ARMS"
          read -ra suites <<< "$SUITES"
          read -ra only <<< "$ONLY"
          if test "${#only[@]}" -gt 0; then
            selection=(source=fastbrowse "${only[@]}")
          else
            selection=(source=fastbrowse)
            for suite in "${suites[@]}"; do
              mapfile -t suite_tasks < <(uv run --no-sync python -c \
                'import sys; from parallax.task import source_tasks; print(*(task.id for task in source_tasks(source_names=("fastbrowse",)) if task.data.get("suite") == sys.argv[1]), sep="\n")' \
                "$suite")
              selection+=("${suite_tasks[@]}")
            done
          fi
          test "${#selection[@]}" -gt 0 || { echo "::error::the selected suites contain no tasks"; exit 1; }
          mapfile -t invocations < <(uv run --no-sync python -c \
            'import sys; from fastbrowse_evals.arms import print_invocations; print_invocations(sys.argv[1:])' \
            "${arms[@]}")
          for invocation in "${invocations[@]}"; do
            IFS=$'\t' read -r public harness model <<< "$invocation"
            run_out="$OUT/$CAMPAIGN_ID-$GROUP-$public"
            mirror="$OUT/mirror-$CAMPAIGN_ID-$GROUP-$public"
            mkdir -p "$run_out" "$mirror"
            python3 - "$run_out" "$mirror" <<'PY' &
          import os
          import shutil
          import sys
          import time
          from pathlib import Path

          source, target = map(Path, sys.argv[1:])
          def mirror_files() -> None:
              if not source.is_dir():
                  return
              for path in source.rglob("*"):
                  if not path.is_file():
                      continue
                  destination = target / path.relative_to(source)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if destination.exists():
                      try:
                          if destination.stat().st_ino == path.stat().st_ino:
                              continue
                      except FileNotFoundError:
                          continue
                      temporary = destination.with_suffix(destination.suffix + ".tmp")
                      try:
                          shutil.copy2(path, temporary)
                          temporary.replace(destination)
                      except FileNotFoundError:
                          temporary.unlink(missing_ok=True)
                      continue
                  try:
                      os.link(path, destination)
                  except FileNotFoundError:
                      pass
                  except OSError:
                      try:
                          shutil.copy2(path, destination)
                      except FileNotFoundError:
                          pass
          while not source.exists():
              time.sleep(0.25)
          while source.exists():
              mirror_files()
              time.sleep(0.25)
          mirror_files()
          PY
            mirror_pid=$!
            # The foreground loop is sequential, so one journal can enforce the shared campaign limit.
            args=(--harness "$harness" --repeats "$REPEAT" --budget "$BUDGET" --reserve "$RESERVE"
              --budget-journal "$OUT/budget.jsonl"
              --retry-invalid 2 --retry-wait 60 --provenance "fastbrowse.group=$GROUP" --out "$run_out")
            test -z "${model:-}" || args+=(--model "$model")
            test -z "${{ matrix.conc }}" || args+=(--concurrency "${{ matrix.conc }}")
            set +e
            uv run --no-sync parallax run "${selection[@]}" "${args[@]}"
            status=$?
            set -e
            if test "$status" -eq 0; then
              run_id="$(jq -r .run_id "$mirror/manifest.json")"
              jq -n --arg run_id "$run_id" '{verified: true, run_id: $run_id}' > "$mirror/parallax-verify.json"
            fi
            kill "$mirror_pid" 2> /dev/null || true
            wait "$mirror_pid" 2> /dev/null || true
            # The arms share one journal outside their run directories; each mirror keeps a copy as its arm ended.
            test ! -f "$OUT/budget.jsonl" || cp "$OUT/budget.jsonl" "$mirror/budget.jsonl"
            test "$status" -eq 0 || exit "$status"
          done
      - name: Report the final progress
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ inputs.campaign_id || github.event.client_payload.campaign_id }}
        run: python3 ci/scripts/eval_progress.py "$OUT" "$CAMPAIGN_ID / ${{ matrix.label }}" --final
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: run-${{ matrix.key }}
          path: ${{ github.workspace }}/runs/${{ matrix.out }}/mirror-*
          if-no-files-found: warn
          retention-days: 30

  # Validate each run directory before publication. A stopped group remains an artifact with its budget journal.
  track:
    name: Validate ${{ matrix.label }} Parallax run
    needs: [resolve, campaign]
    if: ${{ always() && needs.resolve.result == 'success' && needs.campaign.result != 'skipped' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {contents: read, actions: read}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      OUT: ${{ github.workspace }}/runs/${{ matrix.out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.fastbrowse_sha }}
          path: fastbrowse
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.harness_sha }}
          path: harness
          persist-credentials: false
      - name: Install the harness and fastbrowse
        env:
          FASTBROWSE_SHA: ${{ needs.resolve.outputs.fastbrowse_sha }}
        run: |
          cd harness/evals
          uv sync --locked --no-install-package fastbrowse
          uv pip install "fastbrowse @ git+file://$GITHUB_WORKSPACE/fastbrowse@$FASTBROWSE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # The artifact holds the mirrors at its root, so they land in this group's own directory.
        with: {path: "runs/${{ matrix.out }}", pattern: "run-${{ matrix.key }}", merge-multiple: true}
      - name: Check the Parallax run artifacts
        run: |
          mapfile -t run_dirs < <(find "$OUT" -type f -name parallax-verify.json -exec dirname {} \; | sort -u)
          test "${#run_dirs[@]}" -gt 0
          for run_dir in "${run_dirs[@]}"; do
            test -f "$run_dir/results.jsonl"
            test -f "$run_dir/budget.jsonl"
            test -f "$run_dir/provenance.json"
            test -f "$run_dir/parallax-verify.json"
          done

  stage:
    name: Build the candidate
    needs: [resolve, campaign, track]
    # A smoke builds none. A narrowed rerun, or a candidate_only dispatch that ran nothing, builds it with the
    # campaign's earlier Parallax run directories.
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success'
      && (needs.campaign.result == 'success' || needs.campaign.result == 'skipped')
      && (needs.track.result == 'success' || needs.track.result == 'skipped')
      && !(inputs.smoke || github.event.client_payload.smoke == true) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.fastbrowse_sha }}
          path: fastbrowse
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.harness_sha }}
          path: harness
          # Publication checks that every run's agent and runner commits are in the history of the newest build.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the harness and fastbrowse
        env:
          FASTBROWSE_SHA: ${{ needs.resolve.outputs.fastbrowse_sha }}
        run: |
          cd harness/evals
          uv sync --locked --no-install-package fastbrowse
          # The package metadata records the measured build, and publication checks the run provenance.
          uv pip install "fastbrowse @ git+file://$GITHUB_WORKSPACE/fastbrowse@$FASTBROWSE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.campaign.result == 'success' }}
        with: {path: runs, pattern: run-*, merge-multiple: true}
      - name: Fetch the campaign's earlier runs
        # Every finished run of this campaign, found by its title as the release gate finds them. Publication takes
        # each task from the newest run that measured it in full and reads no further a run that supplies none.
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ inputs.campaign_id || github.event.client_payload.campaign_id }}
        run: |
          mapfile -t runs < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow benchmark-campaign.yml \
            --status completed --limit 100 --json databaseId,displayTitle \
            --jq '.[] | select((.displayTitle | split(" ") | last) == env.CAMPAIGN_ID) | .databaseId')
          for run in "${runs[@]}"; do
            test "$run" = "$GITHUB_RUN_ID" && continue
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'run-*' --dir "earlier-runs/$run" \
              || echo "run $run kept no Parallax artifact"
          done
      - name: Fetch the official Parallax runs
        if: ${{ env.OFFICIAL_RUNS != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -ra runs <<< "$OFFICIAL_RUNS"
          for run in "${runs[@]}"; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'official-run-*' --dir "official-runs/$run"
          done
      - name: Export the catalog
        run: |
          cd harness/evals
          uv run --no-sync fastbrowse-evals browser catalog "$GITHUB_WORKSPACE/catalog.json"
      - name: Build the candidate
        # This job runs only when every selected group finished, and the publication gate refuses a run whose
        # recorded arms differ from its group's.
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id || github.event.client_payload.campaign_id }}
          RUN_ON: ${{ needs.resolve.outputs.run_on }}
        run: |
          cd harness/evals
          args=()
          mapfile -t found < <(find "$GITHUB_WORKSPACE/runs" "$GITHUB_WORKSPACE/earlier-runs" \
            -type f -name parallax-verify.json -exec dirname {} \; 2> /dev/null | sort -u)
          if test "${#found[@]}" -gt 0; then args+=("${found[@]}"); fi
          mapfile -t official < <(find "$GITHUB_WORKSPACE/official-runs" \
            -type f -name parallax-verify.json -exec dirname {} \; 2> /dev/null | sort -u)
          if test "${#official[@]}" -gt 0; then args+=("${official[@]}"); fi
          mkdir -p "$GITHUB_WORKSPACE/candidate"
          uv run --no-sync fastbrowse-evals browser publish-candidate \
            "${args[@]}" \
            --campaign-id "$CAMPAIGN_ID" \
            --out "$GITHUB_WORKSPACE/candidate/benchmark-candidate.json"
      - name: Record the run facts
        # What the site shows beside the figures: the run date, harness and judge. The date and harness come from the
        # candidate, the newest run's, so a candidate rebuilt later from finished runs keeps when and how they were
        # measured rather than the rebuild's own date and checkout.
        env:
          # Source records carry the measurement dates; the dispatch date is only a fallback for old artifacts.
          DISPATCHED_ON: ${{ needs.resolve.outputs.run_on }}
          PARALLAX_JUDGE_MODELS: ${{ vars.PARALLAX_JUDGE_MODELS }}
        run: |
          candidate="$GITHUB_WORKSPACE/candidate/benchmark-candidate.json"
          RUN_ON="$(jq -r '[.groups[].sources[]?.measured_on] | max // empty' "$candidate")"
          RUN_ON="${RUN_ON:-$DISPATCHED_ON}"
          HARNESS_SHA="$(jq -r .runner_sha "$candidate")"
          # An official suite has its own run date and upstream judge, read from its Parallax manifest and results.
          groups="$(
            find "$GITHUB_WORKSPACE/official-runs" -type f -name parallax-verify.json -print0 2> /dev/null \
              | while IFS= read -r -d '' marker; do
                  directory="$(dirname "$marker")"
                  manifest="$directory/manifest.json"
                  group="$(jq -r '.selection | split(" ")[] | select(. == "bu-bench" or . == "online-mind2web")' "$manifest" | head -n 1)"
                  test -n "$group" || continue
                  run_on="$(jq -r '.created_at[0:10]' "$manifest")"
                  judge="$(jq -r 'select(.judge_identity != null) | .judge_identity' "$directory/results.jsonl" | head -n 1)"
                  jq -n --arg group "$group" --arg run_on "$run_on" --arg judge "$judge" \
                    '{group: $group, value: {run_on: $run_on, judge: ($judge + " through upstream bridge")}}'
                done \
              | jq -s 'map({key: .group, value: .value}) | from_entries'
          )"
          test -n "$groups" || groups='{}'
          jq -n --arg run_on "$RUN_ON" --arg harness "fastbrowse-evals at ${HARNESS_SHA:0:7}" \
            --arg judge "$PARALLAX_JUDGE_MODELS through OpenRouter" --argjson groups "$groups" \
            '{run_on: $run_on, harness: $harness, judge: $judge, groups: $groups}' \
            > "$GITHUB_WORKSPACE/candidate/run-facts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Open the site pull request
    needs: stage
    # A candidate_only run skips the measuring jobs, and a skipped ancestor skips this job unless it says otherwise.
    if: ${{ !cancelled() && needs.stage.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-evals.yml
    secrets:
      FASTBROWSE_SITE_TOKEN: ${{ secrets.FASTBROWSE_SITE_TOKEN }}
