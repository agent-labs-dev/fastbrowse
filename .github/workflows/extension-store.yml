name: Extension Store
on:
  push:
    branches: [main]
    paths: ["crates/fastbrowse-browser/extension/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: Build, inspect status, submit for staged review, or publish an approved version
        type: choice
        options: [build, status, submit, publish]
        default: build
permissions: {}
concurrency:
  group: extension-store
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions: {contents: read}
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: package
        env:
          STORE_ACTION: ${{ inputs.action || 'build' }}
        run: |
          if [[ "$STORE_ACTION" != build && "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Store actions require main or a release tag' >&2
            exit 1
          fi
          python3 scripts/extension_store.py build > dist-receipt.json
          python3 -c 'import json, os; r=json.load(open("dist-receipt.json")); print("version="+r["version"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-store-package
          path: |
            dist/fastbrowse-extension.zip
            dist-receipt.json
          if-no-files-found: error
  store:
    needs: package
    if: >-
      (github.event_name == 'push' || inputs.action != 'build') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-store-package
          path: store-artifact
      - name: Require publisher configuration
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          for name in CWS_PUBLISHER_ID CWS_SERVICE_ACCOUNT CWS_WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!name}" ]]; then echo "Missing configuration: $name" >&2; exit 1; fi
          done
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Store action
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          STORE_ACTION: ${{ inputs.action || (startsWith(github.ref, 'refs/tags/') && 'verify') || 'submit' }}
          EXTENSION_VERSION: ${{ needs.package.outputs.version }}
        run: |
          python3 scripts/extension_store.py "$STORE_ACTION" --package store-artifact/dist/fastbrowse-extension.zip --receipt store-artifact/dist-receipt.json --version "$EXTENSION_VERSION" > store-receipt.json
          cat store-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-store-receipt
          path: store-receipt.json
          if-no-files-found: error
