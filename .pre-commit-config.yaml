# The checks CI runs, run again before each commit: `uv run pre-commit install` once, then they are automatic.
# Prose (`scripts/no_slop.py`, Vale) and the tests stay in CI, where they can take their time.
# Update hook revisions and pyproject.toml tool pins together, then run `uv lock`; autoupdate only edits this file.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.99
    hooks:
      # Checks the whole project, not the staged files: a change in one file moves diagnostics in another.
      # `--no-sync`: pre-commit runs hooks over the stashed tree, so a sync would rebuild the native library from it
      # and leave `src/fastbrowse/_native.abi3.so` stale for every later run on this checkout (#766).
      - id: ty
        args: [--no-sync]
