[project]
name = "fastbrowse"
version = "0.5.20"
description = "Browser automation with cited answers, structured output and code-controlled credentials and authorization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Agent Labs" }]
requires-python = ">=3.13"
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    "cdp-use==1.4.5",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    # Imported to tell a browser endpoint that is still starting from one that will never answer.
    "websockets>=14,<18",
]

[project.urls]
Homepage = "https://github.com/agent-labs-dev/fastbrowse"
Repository = "https://github.com/agent-labs-dev/fastbrowse"
Issues = "https://github.com/agent-labs-dev/fastbrowse/issues"

[project.optional-dependencies]
browser-use = ["browser-use-sdk==3.11.3"]
eval-data = ["pyyaml>=6,<7"]
# The MCP server, `fastbrowse-mcp`.
mcp = ["mcp>=1.20,<2"]

[project.scripts]
fastbrowse = "fastbrowse.cli:main"
fastbrowse-mcp = "fastbrowse.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastbrowse"]

[tool.hatch.build.targets.sdist]
exclude = [".sift", ".agents", "package.json", "package-lock.json", "biome.json", "packages", "packaging"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    "vale==3.22.0.0",
    "pytest-timeout>=2.3,<3",
    "ty==0.0.84",          # preview: pinned, and moved with the pre-commit hook
    "pre-commit>=4.6.2",
    "actionlint-py==1.7.12.25",
]
# What builds the native executable (`packaging/fastbrowse.spec`). A group of its own, so that the build
# environment holds the package, this, and neither the development tools nor an extra.
freeze = ["pyinstaller==6.22.3"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Keep vendored helpers byte-for-byte identical to upstream.
extend-exclude = [".sift/gate.py", ".sift/agents.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests import helpers as tests.browser.*, which needs the repo root importable.
pythonpath = ["."]
asyncio_mode = "auto"
# A hung browser call otherwise holds CI for its full hour with no output; this fails the test and dumps every stack.
timeout = 120

[tool.ty.src]
# The package and its tests, which is the scope the checker has always had. `scripts/` runs jev-ultrafast in its own environment
# and imports modules that are not installed here, which is the point of it.
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.13"
