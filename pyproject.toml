[project]
name = "fastbrowse"
version = "0.7.4"
description = "Browser automation with cited answers, structured output and code-controlled credentials and authorization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Agent Labs" }]
requires-python = ">=3.13"
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    "cdp-use==1.4.5",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    # Imported to tell a browser endpoint that is still starting from one that will never answer.
    "websockets>=14,<18",
]

[project.urls]
Homepage = "https://github.com/agent-labs-dev/fastbrowse"
Repository = "https://github.com/agent-labs-dev/fastbrowse"
Issues = "https://github.com/agent-labs-dev/fastbrowse/issues"

[project.optional-dependencies]
browser-use = ["browser-use-sdk==3.12.1"]
eval-data = ["pyyaml>=6,<7"]
# The Python core's MCP server, which `fastbrowse-mcp` runs with FASTBROWSE_PYTHON_CORE=1; the Rust one needs nothing.
# mcp 2.x renamed FastMCP to MCPServer and changed other APIs; migrating the server is its own change.
mcp = ["mcp>=1.20,<2"]

[project.scripts]
fastbrowse = "fastbrowse.commands:fastbrowse"
fastbrowse-mcp = "fastbrowse.commands:fastbrowse_mcp"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# One abi3 wheel per platform: the Python package with the Rust core beside it as `fastbrowse._native`
# (docs/adr/0004). The sdist carries the crates it is built from, so installing from it needs a Rust toolchain.
[tool.maturin]
manifest-path = "crates/fastbrowse-py/Cargo.toml"
module-name = "fastbrowse._native"
python-source = "src"
python-packages = ["fastbrowse"]

[tool.uv]
# The environment's own build is a debug one, minutes faster than the LTO release profile; the published wheels are
# built by the release workflow with maturin directly.
config-settings = { build-args = "--profile=dev" }
# The project is a compiled extension too, so a change to the Rust core reinstalls it on the next `uv sync`.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
    { file = "src/**/*.js" },
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    "vale==3.25.1.0",
    "pytest-timeout>=2.3,<3",
    "ty==0.0.92",          # preview: pinned, and moved with the pre-commit hook
    "pre-commit>=4.6.2",
    "actionlint-py==1.7.12.25",
]
# What builds the native executable (`packaging/fastbrowse.spec`). A group of its own, so that the build
# environment holds the package, this, and neither the development tools nor an extra.
freeze = ["pyinstaller==6.22.3"]
# snapshot.js benchmarks (`benchmarks/`), which CodSpeed runs when the script changes.
bench = ["pytest-codspeed>=5,<6"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Keep vendored helpers byte-for-byte identical to upstream.
extend-exclude = [".sift/gate.py", ".sift/agents.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests import helpers as tests.browser.*, which needs the repo root importable.
pythonpath = ["."]
asyncio_mode = "auto"
# A hung browser call otherwise holds CI for its full hour with no output; this fails the test and dumps every stack.
timeout = 120

[tool.ty.src]
# The package and its tests, which is the scope the checker has always had. `scripts/` runs jev-ultrafast in its own environment
# and imports modules that are not installed here, which is the point of it.
include = ["src", "tests", "benchmarks"]

[tool.ty.environment]
python-version = "3.13"
