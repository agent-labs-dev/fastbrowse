[project]
name = "fastbrowse"
version = "0.11.0"
description = "Browser automation with cited answers, structured output and code-controlled credentials and authorization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "crates/fastbrowse-browser/js/autoconsent/LICENSE"]
authors = [{ name = "Agent Labs" }]
requires-python = ">=3.13"
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    "httpx[http2]>=0.28.1,<1",
    "packaging>=24,<27",  # the bench walks distribution metadata: fastbrowse/evals/bench.py (#764)
    "pydantic>=2.14.2,<3",
]

[project.urls]
Homepage = "https://github.com/agent-labs-dev/fastbrowse"
Repository = "https://github.com/agent-labs-dev/fastbrowse"
Issues = "https://github.com/agent-labs-dev/fastbrowse/issues"

[project.optional-dependencies]
eval-data = ["pyyaml>=6.0.3,<7"]
evals = ["parallax-evals==2.0.0.dev22"]

[project.scripts]
fastbrowse = "fastbrowse.commands:fastbrowse"
fastbrowse-mcp = "fastbrowse.commands:fastbrowse_mcp"

[build-system]
# The oldest maturin that builds the package, not the one CI pins: the AUR package builds the sdist with Arch's own
# python-maturin, which refuses a bound above its version.
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

# One abi3 wheel per platform: the Python package with the Rust core beside it as `fastbrowse._native`
# (docs/adr/0004). The sdist carries the crates it is built from, so installing from it needs a Rust toolchain.
[tool.maturin]
manifest-path = "crates/fastbrowse-py/Cargo.toml"
module-name = "fastbrowse._native"
python-source = "src"
python-packages = ["fastbrowse"]

[tool.uv]
# The environment's own build is a debug one, minutes faster than the LTO release profile; the published wheels are
# built by the release workflow with maturin directly.
config-settings = { build-args = "--profile=dev" }
# The project is a compiled extension too, so a change to the Rust core reinstalls it on the next `uv sync`.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/fastbrowse-browser/js/**/*.js" },
]

[dependency-groups]
dev = [
    "parallax-evals==2.0.0.dev22",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4.1,<2",
    "ruff>=0.17.3,<1",
    "vale==3.26.0.1",
    "pytest-timeout>=2.4,<3",
    "ty==0.0.96",          # preview: pinned, and moved with the pre-commit hook
    "pre-commit>=4.7.0",
    "actionlint-py==1.7.12.25",
]
# snapshot.js benchmarks (`benchmarks/`), which CodSpeed runs when the script changes.
bench = ["pytest-codspeed>=5.0.4,<6"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests import helpers as tests.browser.*, which needs the repo root importable.
pythonpath = ["."]
asyncio_mode = "auto"
# A hung browser call otherwise holds CI for its full hour with no output; this fails the test and dumps every stack.
timeout = 120
# The cassette replay runs in its own CI job, which installs Chrome, so the gate's plain run leaves it out.
addopts = "-m 'not cassette_replay'"
markers = [
    "cassette_replay: replays every bench cassette at zero latency (the replay CI job)",
]

[tool.ty.src]
include = ["src", "tests", "benchmarks"]

[tool.ty.environment]
python-version = "3.13"
# The release gate and its tests reach the eval plugin, which lives in its own project under evals/.
extra-paths = ["evals/src"]
